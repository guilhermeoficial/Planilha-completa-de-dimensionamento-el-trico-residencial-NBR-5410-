<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡💻 ByteVolt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-panel:#0d1729; --bg-panel2:#101d33; --line:#22334c;
    --copper:#cc9a3f; --copper-dim:#a67d2f; --safety:#d9ab42;
    --live:#3ecf8e; --danger:#ef4b5f; --ink:#eef1f6; --ink-dim:#93a0b4;
    --a:#3ea6ff; --b:#ff8a3d; --c:#3ecf8e; --d:#c88bff;
    --chip-bg:#0d1119; --glow-a:rgba(204,154,63,0.07); --glow-b:rgba(79,155,206,0.07); --accent-soft:#1a1608;
  }
  :root[data-theme="light"]{
    --bg-panel:#eef1f6; --bg-panel2:#ffffff; --line:#d8dee8;
    --copper:#8a5a12; --copper-dim:#6e480e; --safety:#a67c0a;
    --live:#1f9d67; --danger:#d63451; --ink:#14181f; --ink-dim:#5b6472;
    --a:#1c6fc9; --b:#d9661c; --c:#1f9d67; --d:#7a4cc0;
    --chip-bg:#eef1f5; --glow-a:rgba(138,90,18,0.06); --glow-b:rgba(39,95,138,0.06); --accent-soft:#fff3d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, var(--glow-a), transparent 40%),
      radial-gradient(circle at 85% 90%, var(--glow-b), transparent 45%),
      var(--bg-panel);
    background-attachment:fixed;
    font-family:'Manrope',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    transition:background-color .25s, color .25s;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
  .circuit-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35;}
  .wrap{position:relative;z-index:1;width:100%;max-width:820px;}
  .wrap.wide{max-width:960px;}

  h1.brand{font-family:'Archivo Black',sans-serif;font-size:clamp(28px,5vw,44px);letter-spacing:0.5px;text-align:center;margin:8px 0 4px;color:var(--ink);}
  h1.brand span{color:var(--safety);}
  .tagline{text-align:center;color:var(--ink-dim);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:28px;font-weight:700;}

  .card{background:linear-gradient(180deg, var(--bg-panel2), var(--bg-panel));border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 20px 40px -20px rgba(0,0,0,0.35);}

  .theme-toggle{position:fixed;top:16px;right:16px;z-index:200;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg-panel2);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,0.25);transition:transform .15s, border-color .15s;}
  .theme-toggle:hover{transform:scale(1.08);border-color:var(--copper-dim);}

  input.nick, input.pinput{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--chip-bg);color:var(--ink);font-size:16px;font-family:'Manrope';outline:none;transition:border-color .2s;}
  input.pinput{font-family:'Space Mono',monospace;letter-spacing:10px;text-align:center;font-size:26px;font-weight:700;}
  input.nick:focus, input.pinput:focus{border-color:var(--copper);}
  label.field-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-dim);font-weight:800;margin-bottom:8px;}
  .field-gap{margin-top:18px;}

  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px;}
  @media(max-width:560px){.avatar-grid{grid-template-columns:repeat(2,1fr);}}
  .avatar-card{background:var(--chip-bg);border:2px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;position:relative;}
  .avatar-card:hover{transform:translateY(-3px);border-color:var(--copper-dim);}
  .avatar-card.selected{border-color:var(--safety);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(255,204,51,0.15);}
  .avatar-emoji{font-size:34px;line-height:1;margin-bottom:8px;}
  .avatar-name{font-size:12px;font-weight:800;color:var(--ink);}
  .avatar-badge{position:absolute;top:6px;right:8px;font-size:14px;opacity:0.85;}

  /* Character customizer */
  .avatar-chip{display:inline-flex;width:40px;height:40px;flex-shrink:0;vertical-align:middle;}
  .avatar-chip svg{width:100%;height:100%;display:block;overflow:visible;}
  .avatar-chip.lg{width:96px;height:96px;}
  .avatar-chip.xl{width:150px;height:150px;}
  .avatar-svg .avatar-bob{animation:avatarBob 2.6s ease-in-out infinite;}
  @keyframes avatarBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .avatar-eyelid{animation:avatarBlink 4.4s ease-in-out infinite;}
  @keyframes avatarBlink{0%,90%,100%{opacity:0;}94%{opacity:1;}97%{opacity:0;}}
  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s, border-color .15s;}
  .swatch:hover{transform:scale(1.08);}
  .swatch.selected{border-color:var(--safety);box-shadow:0 0 0 3px rgba(255,204,51,0.18);}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .face-chip{background:var(--chip-bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:border-color .15s, transform .15s;color:var(--ink);}
  .face-chip:hover{transform:translateY(-2px);border-color:var(--copper-dim);}
  .face-chip.selected{border-color:var(--safety);background:var(--accent-soft);}

  /* Speech / thought bubbles */
  .speech-wrap{position:relative;display:inline-flex;}
  .speech-bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:12px;background:#f5f5f0;color:#14181f;padding:7px 12px;border-radius:14px;font-size:12px;font-weight:700;max-width:170px;min-width:60px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,0.35);z-index:5;line-height:1.35;font-family:'Manrope',sans-serif;}
  .speech-bubble.fala:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#f5f5f0;}
  .speech-bubble.pensamento{border-radius:50%/60%;}
  .speech-bubble.pensamento:after{content:'';position:absolute;top:100%;left:36%;width:11px;height:11px;border-radius:50%;background:#f5f5f0;}
  .speech-bubble.pensamento:before{content:'';position:absolute;top:calc(100% + 9px);left:28%;width:6px;height:6px;border-radius:50%;background:#f5f5f0;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:12px;border:none;cursor:pointer;font-family:'Manrope';font-weight:800;font-size:15px;letter-spacing:0.3px;transition:transform .12s, filter .12s;user-select:none;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{background:var(--safety);color:#1a1608;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:2px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--copper-dim);}
  .btn-block{width:100%;}
  .btn-row{display:flex;justify-content:center;margin-top:24px;gap:12px;flex-wrap:wrap;}

  .menu-options{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .menu-opt{display:flex;align-items:center;gap:16px;background:var(--chip-bg);border:2px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;transition:border-color .15s, transform .15s;text-align:left;}
  .menu-opt:hover{border-color:var(--copper-dim);transform:translateY(-2px);}
  .menu-opt .ic{font-size:28px;}
  .menu-opt .tt{font-weight:800;font-size:15.5px;color:var(--ink);}
  .menu-opt .ds{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}

  .hud{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:16px;font-family:'Space Mono',monospace;}
  .hud-item{background:var(--chip-bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
  .hud-item b{color:var(--safety);font-size:15px;}
  .qcounter{font-family:'Space Mono',monospace;color:var(--ink-dim);font-size:13px;}

  .wire-track{position:relative;width:100%;height:14px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--line);overflow:hidden;margin-bottom:22px;}
  .wire-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg, var(--live), var(--safety));border-radius:10px;transition:width 0.25s linear, background 0.4s linear;}
  .wire-spark{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,0.9);transform:translate(-50%,-50%);transition:left 0.25s linear;}

  .question-box{text-align:center;padding:6px 4px 22px;}
  .code-block{
    text-align:left;background:var(--chip-bg);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin:16px auto 4px;max-width:520px;overflow-x:auto;
    font-family:'Space Mono',monospace;font-size:14px;line-height:1.6;color:var(--live);
    white-space:pre;
  }
  .qnum{font-family:'Space Mono',monospace;color:var(--copper);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-weight:700;}
  .qtext{font-family:'Archivo Black',sans-serif;font-size:clamp(19px,3.2vw,26px);line-height:1.35;color:var(--ink);}

  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  @media(max-width:560px){.options-grid{grid-template-columns:1fr;}}
  .opt{display:flex;align-items:center;gap:12px;padding:18px 16px;border-radius:14px;border:none;cursor:pointer;font-family:'Manrope';font-weight:700;font-size:15.5px;text-align:left;color:#14181f;transition:transform .1s, filter .1s, opacity .2s;}
  .opt:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-2px);}
  .opt:disabled{cursor:default;}
  .opt-icon{font-size:20px;flex-shrink:0;}
  .opt-a{background:var(--a);} .opt-b{background:var(--b);} .opt-c{background:var(--c);} .opt-d{background:var(--d);}
  .opt.correct{outline:4px solid var(--live);box-shadow:0 0 24px rgba(62,207,142,0.55);}
  .opt.wrong{outline:4px solid var(--danger);box-shadow:0 0 24px rgba(239,75,95,0.5);opacity:0.75;}
  .opt.dim{opacity:0.35;}

  .feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:14px;background:var(--chip-bg);border:1px solid var(--line);color:var(--ink-dim);text-align:left;line-height:1.5;}
  .feedback b{color:var(--ink);}
  .feedback.ok{border-color:rgba(62,207,142,0.4);}
  .feedback.bad{border-color:rgba(239,75,95,0.4);}

  .streak-pop{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--safety);color:#1a1608;font-weight:800;font-family:'Space Mono',monospace;padding:8px 18px;border-radius:30px;font-size:14px;z-index:50;animation:popIn .35s ease, popOut .3s ease 1.4s forwards;box-shadow:0 8px 20px rgba(0,0,0,0.4);}
  @keyframes popIn{from{opacity:0;transform:translate(-50%,-10px) scale(0.8);}to{opacity:1;transform:translate(-50%,0) scale(1);}}
  @keyframes popOut{to{opacity:0;transform:translate(-50%,-10px) scale(0.8);}}
  .particles{position:fixed;inset:0;pointer-events:none;z-index:40;}
  .particle{position:absolute;font-size:22px;animation:rise 1s ease-out forwards;}
  @keyframes rise{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(-140px) rotate(30deg);}}
  .shake{animation:shakeAnim .4s;}
  @keyframes shakeAnim{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-8px);}40%,60%{transform:translateX(8px);}}

  /* Podium celebration: confetti rain */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden;}
  .confetti-piece{position:absolute;top:-24px;opacity:0.95;animation:confettiFall linear forwards;border-radius:2px;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(112vh) rotate(760deg);opacity:0.85;}
  }
  /* Podium celebration: firework bursts */
  .firework{position:fixed;pointer-events:none;z-index:71;width:0;height:0;}
  .spark{position:absolute;top:0;left:0;width:7px;height:7px;border-radius:50%;animation:sparkFly 0.9s ease-out forwards;}
  @keyframes sparkFly{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(0.25);opacity:0;}
  }
  /* Podium celebration: jumping avatars */
  @keyframes avatarJump{
    0%,100%{transform:translateY(0) scale(1,1);}
    28%{transform:translateY(-16px) scale(1.06,0.94);}
    52%{transform:translateY(0) scale(0.94,1.06);}
    75%{transform:translateY(-7px) scale(1.02,0.98);}
  }
  .avatar-chip.jump .avatar-bob{animation:avatarJump 0.75s ease-in-out infinite; animation-delay:var(--jd,0s);}

  .result-emoji{font-size:64px;text-align:center;margin-bottom:6px;}
  .result-title{font-family:'Archivo Black';font-size:24px;text-align:center;color:var(--safety);}
  .result-sub{text-align:center;color:var(--ink-dim);margin-top:4px;font-size:14px;}
  .stat-row{display:flex;justify-content:center;gap:14px;margin:22px 0;flex-wrap:wrap;}
  .stat-box{background:var(--chip-bg);border:1px solid var(--line);border-radius:14px;padding:14px 20px;text-align:center;min-width:100px;}
  .stat-box .num{font-family:'Space Mono';font-size:22px;color:var(--copper);font-weight:700;}
  .stat-box .lab{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

  .leaderboard{margin-top:8px;}
  .lb-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--line);margin-bottom:8px;font-family:'Space Mono',monospace;font-size:13.5px;transition:transform 0.5s cubic-bezier(.34,1.56,.64,1), opacity 0.4s ease;position:relative;}
  .lb-row.lb-enter{animation:lbSlideIn 0.5s cubic-bezier(.34,1.56,.64,1) both;}
  .lb-row.lb-up{animation:lbMoveUp 0.6s cubic-bezier(.34,1.56,.64,1) both;}
  .lb-row.lb-down{animation:lbMoveDown 0.5s ease both;}
  @keyframes lbSlideIn{from{transform:translateX(-30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes lbMoveUp{0%{transform:translateY(20px) scale(0.97);opacity:0.6;}60%{transform:translateY(-4px) scale(1.02);}100%{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes lbMoveDown{0%{transform:translateY(-10px);opacity:0.7;}100%{transform:translateY(0);opacity:1;}}
  .lb-delta{font-size:11px;font-weight:800;margin-left:4px;padding:2px 6px;border-radius:20px;}
  .lb-delta.up{background:rgba(62,207,142,0.2);color:var(--live);}
  .lb-delta.down{background:rgba(239,75,95,0.15);color:var(--danger);}
  .lb-delta.same{background:rgba(255,204,51,0.15);color:var(--safety);}
  .lb-rank{width:26px;color:var(--ink-dim);font-weight:700;}
  .lb-name{flex:1;color:var(--ink);font-weight:700;font-family:'Manrope';display:flex;align-items:center;gap:8px;}
  .lb-score{color:var(--safety);font-weight:700;}
  .lb-you{border-color:var(--safety);background:var(--accent-soft);}

  .footnote{text-align:center;color:var(--ink-dim);font-size:11.5px;margin-top:18px;line-height:1.5;}
  .loading-note{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:14px;}

  /* PIN display */
  .pin-box{text-align:center;padding:18px 0 6px;}
  .pin-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--ink-dim);font-weight:800;margin-bottom:10px;}
  .pin-value{font-family:'Space Mono',monospace;font-size:clamp(44px,10vw,72px);font-weight:700;letter-spacing:10px;color:var(--safety);text-shadow:0 0 30px rgba(255,204,51,0.35);}
  .pin-hint{color:var(--ink-dim);font-size:13px;margin-top:6px;}

  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:18px;}
  .roster-card{background:var(--chip-bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;animation:popIn .3s ease;overflow:hidden;}
  .roster-card .avatar-chip{overflow:hidden;}
  /* Animação de espera: balança levemente sem sair do card */
  @keyframes rosterBob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-3px) rotate(1deg);}}
  @keyframes rosterWave{0%,100%{transform:rotate(0deg);}25%{transform:rotate(8deg);}75%{transform:rotate(-8deg);}}
  .roster-card .avatar-bob{animation:rosterBob 1.8s ease-in-out infinite;}
  .roster-card .avatar-chip{display:block;margin:0 auto;}
  .roster-emoji{font-size:24px;}
  .roster-name{font-size:11px;font-weight:700;margin-top:4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .roster-count{text-align:center;font-family:'Space Mono';color:var(--copper);font-weight:700;margin-top:14px;font-size:14px;}

  .bar-row{margin-bottom:12px;}
  .bar-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:5px;}
  .bar-track{height:22px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--line);overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;transition:width .5s ease;}

  .waiting-pulse{text-align:center;padding:30px 0;}
  .waiting-pulse .em{font-size:48px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.12);opacity:0.7;}}

  .podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:26px 0 10px;flex-wrap:nowrap;}
  .pod-col{text-align:center;}
  .pod-block{background:linear-gradient(180deg,#1c2432,#0d1119);border:1px solid var(--line);border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:'Space Mono';font-weight:700;color:var(--safety);}
  .pod-1 .pod-block{height:120px;width:88px;border-color:var(--safety);}
  .pod-2 .pod-block{height:88px;width:78px;border-color:#c9c9c9;}
  .pod-3 .pod-block{height:64px;width:78px;border-color:#d9661c;}
  .pod-4 .pod-block{height:44px;width:64px;}
  .pod-5 .pod-block{height:34px;width:64px;}
  .pod-medal{font-size:18px;margin-bottom:2px;}
  .pod-name{font-size:11.5px;font-weight:800;margin-top:8px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pod-em{font-size:26px;}
  @media(max-width:560px){
    .podium{gap:5px;}
    .pod-1 .pod-block{width:64px;} .pod-2 .pod-block{width:56px;} .pod-3 .pod-block{width:56px;}
    .pod-4 .pod-block{width:46px;} .pod-5 .pod-block{width:46px;}
    .pod-name{font-size:9.5px;max-width:60px;}
    .pod-em .avatar-chip{width:32px;height:32px;}
  }
</style>
</head>
<body>
<svg class="circuit-bg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <g stroke="#3ea6ff" stroke-width="2" fill="none" opacity="0.5">
    <path d="M0 120 H180 V260 H420"/>
    <path d="M800 60 H600 V220 H380"/>
    <path d="M0 700 H220 V560 H500"/>
    <path d="M800 760 H560 V600 H320"/>
  </g>
  <g fill="#ff8a3d" opacity="0.6">
    <circle cx="180" cy="120" r="5"/><circle cx="420" cy="260" r="5"/>
    <circle cx="600" cy="60" r="5"/><circle cx="380" cy="220" r="5"/>
    <circle cx="220" cy="700" r="5"/><circle cx="500" cy="560" r="5"/>
    <circle cx="560" cy="760" r="5"/><circle cx="320" cy="600" r="5"/>
  </g>
</svg>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------------- Data ----------------
  const CREATURES = [
    {id:'voltz', name:'Voltz', color:'#ffcc33'},
    {id:'bitinho', name:'Bitinho', color:'#20242c'},
    {id:'pilhax', name:'Pilhax', color:'#ffcc33'},
    {id:'resistorzinho', name:'Resistorzinho', color:'#e8d9c4'},

  function buildAvatarSVG(cfg){
    cfg = cfg && typeof cfg === 'object' ? cfg : defaultAvatarCfg();
    const creatureId = CREATURES.some(c=>c.id===cfg.creature) ? cfg.creature : CREATURES[0].id;
    return `<svg viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg" class="avatar-svg">
      <g class="avatar-bob">
        <ellipse cx="80" cy="192" rx="46" ry="7" fill="#000" opacity="0.18"/>
        ${creatureSVG(creatureId)}
        ${accessorySVG(cfg.accessory, creatureId)}
      </g>
    </svg>`;
  }

  function avatarChipHTML(cfg, size, jumpDelay){
    const cls = size ? ' '+size : '';
    const style = jumpDelay!==undefined ? ` style="--jd:${jumpDelay}s;"` : '';
    return `<span class="avatar-chip${cls}"${style}>${buildAvatarSVG(cfg)}</span>`;
  }

  const BUBBLE_TYPES = [
    {id:'nenhum', label:'Nenhum', hint:'🚫'},
    {id:'fala', label:'Fala', hint:'💬'},
    {id:'pensamento', label:'Pensamento', hint:'💭'},
  ];

  // Wraps an avatar chip with its speech/thought bubble (if the player set one).
  function avatarBubbleHTML(cfg, size){
    const chip = avatarChipHTML(cfg, size);
    const bubble = cfg && typeof cfg === 'object' ? cfg.bubble : null;
    if(!bubble || bubble.type==='nenhum' || !bubble.text || !bubble.text.trim()){
      return `<span class="speech-wrap">${chip}</span>`;
    }
    const cls = bubble.type==='pensamento' ? 'pensamento' : 'fala';
    return `<span class="speech-wrap"><span class="speech-bubble ${cls}">${escapeHtml(bubble.text)}</span>${chip}</span>`;
  }

  // Renders the creature picker (live SVG preview + species grid + accessory + bubble) into `container`.
  // Returns getCfg() -> current avatar config object.
  function renderAvatarCustomizer(container, initialCfg){
    let cfg = Object.assign({}, defaultAvatarCfg(), initialCfg||{});
    cfg.bubble = Object.assign({type:'nenhum', text:''}, cfg.bubble||{});
    const box = el(`
      <div>
        <div style="display:flex;justify-content:center;margin:4px 0 18px;" id="avPreviewSlot"></div>
        <label class="field-label">Escolha sua criatura</label>
        <div class="avatar-grid" id="creatureGrid" style="grid-template-columns:repeat(3,1fr);"></div>
        <label class="field-label field-gap">Acessório</label>
        <div class="chip-row" id="accessoryRow"></div>
        <label class="field-label field-gap">Balão de fala ou pensamento</label>
        <div class="chip-row" id="bubbleTypeRow"></div>
        <input class="nick field-gap" id="bubbleTextInput" maxlength="40" placeholder="Escreva uma frase (opcional)"/>
        <div class="btn-row" style="margin-top:6px;">
          <button type="button" class="btn btn-ghost" id="randomBtn">🎲 Sortear criatura</button>
        </div>
      </div>
    `);
    container.appendChild(box);
    const previewSlot = box.querySelector('#avPreviewSlot');
    function repaint(){ previewSlot.innerHTML = avatarBubbleHTML(cfg, 'xl'); }

    function paintCreatureGrid(rowEl){
      rowEl.innerHTML='';
      CREATURES.forEach(cr=>{
        const card = el(`
          <div class="avatar-card ${cfg.creature===cr.id?'selected':''}" data-creature="${cr.id}" style="padding:10px 6px;">
            <div class="avatar-chip" style="margin:0 auto 6px;">${buildAvatarSVG({creature:cr.id, accessory:'nenhum'})}</div>
            <div class="avatar-name">${cr.name}</div>
          </div>
        `);
        card.addEventListener('click', ()=>{ cfg.creature=cr.id; paintCreatureGrid(rowEl); repaint(); });
        rowEl.appendChild(card);
      });
    }
    function paintChips(rowEl, list, key){
      rowEl.innerHTML='';
      list.forEach(item=>{
        const chip = el(`<div class="face-chip ${cfg[key]===item.id?'selected':''}">${item.hint} ${item.label}</div>`);
        chip.addEventListener('click', ()=>{ cfg[key]=item.id; paintChips(rowEl,list,key); repaint(); });
        rowEl.appendChild(chip);
      });
    }
    function paintBubbleTypes(rowEl){
      rowEl.innerHTML='';
      BUBBLE_TYPES.forEach(item=>{
        const chip = el(`<div class="face-chip ${cfg.bubble.type===item.id?'selected':''}">${item.hint} ${item.label}</div>`);
        chip.addEventListener('click', ()=>{ cfg.bubble.type=item.id; paintBubbleTypes(rowEl); repaint(); });
        rowEl.appendChild(chip);
      });
    }

    const creatureGrid=box.querySelector('#creatureGrid'), accessoryRow=box.querySelector('#accessoryRow'), bubbleTypeRow=box.querySelector('#bubbleTypeRow');
    const bubbleTextInput = box.querySelector('#bubbleTextInput');
    paintCreatureGrid(creatureGrid);
    paintChips(accessoryRow, ACCESSORIES, 'accessory');
    paintBubbleTypes(bubbleTypeRow);
    bubbleTextInput.value = cfg.bubble.text || '';
    bubbleTextInput.addEventListener('input', ()=>{ cfg.bubble.text = bubbleTextInput.value; repaint(); });
    repaint();

    box.querySelector('#randomBtn').addEventListener('click', ()=>{
      const keepBubble = cfg.bubble;
      cfg = randomAvatarCfg();
      cfg.bubble = keepBubble;
      paintCreatureGrid(creatureGrid);
      paintChips(accessoryRow, ACCESSORIES, 'accessory');
      repaint();
    });

    return function getCfg(){ return Object.assign({}, cfg, {bubble: Object.assign({}, cfg.bubble)}); };
  }

    {cat:'prog_oo', q:"O que é uma 'classe' na programação orientada a objetos?",
     opts:["Um valor numérico fixo usado no programa","Um molde (modelo) que define atributos e comportamentos comuns a um conjunto de objetos","Um tipo de estrutura de repetição","Um comando exclusivo de bancos de dados"], correct:1,
     exp:"Uma classe é o molde (modelo/blueprint) que define quais atributos (dados) e métodos (comportamentos) os objetos criados a partir dela terão. O objeto é uma instância concreta dessa classe."},
    {cat:'prog_oo', q:"Qual é a diferença entre uma classe e um objeto na POO?",
     opts:["Classe e objeto são exatamente a mesma coisa","A classe é o modelo/molde; o objeto é uma instância concreta criada a partir desse modelo","O objeto sempre existe antes da classe ser definida","Uma classe só pode gerar um único objeto"], correct:1,
     exp:"A classe é a definição abstrata (o molde), enquanto o objeto é uma instância concreta dessa classe, criada em tempo de execução, com valores próprios para seus atributos."},
    {cat:'prog_oo', q:"O que é 'encapsulamento' na programação orientada a objetos?",
     opts:["A capacidade de uma classe herdar atributos de outra classe","O agrupamento de dados e métodos dentro de uma classe, restringindo o acesso direto aos dados internos por código externo","A capacidade de um mesmo método se comportar de formas diferentes","A criação de múltiplos objetos a partir da mesma classe"], correct:1,
     exp:"Encapsulamento é o princípio que agrupa dados (atributos) e comportamentos (métodos) dentro de uma classe, controlando o acesso a esses dados através de modificadores de visibilidade (público, privado, protegido) — protegendo o estado interno do objeto de alterações indevidas."},
    {cat:'prog_oo', q:"O que é 'herança' na programação orientada a objetos?",
     opts:["A capacidade de uma classe (subclasse) reaproveitar atributos e métodos de outra classe (superclasse)","A criação de variáveis globais compartilhadas entre classes","Um tipo de estrutura de repetição exclusiva da POO","A conversão automática de tipos de dados"], correct:0,
     exp:"Herança é o mecanismo pelo qual uma classe (subclasse/classe filha) pode reaproveitar atributos e métodos de outra classe (superclasse/classe mãe), promovendo reutilização de código e criando hierarquias de especialização."},
    {cat:'prog_oo', q:"O que é 'polimorfismo' na programação orientada a objetos?",
     opts:["A capacidade de um mesmo método/comportamento assumir formas diferentes dependendo do objeto que o invoca","A restrição de acesso a atributos privados de uma classe","A criação de uma única classe para todo o sistema","A conversão de um objeto em texto simples"], correct:0,
     exp:"Polimorfismo é a capacidade de um mesmo método (ou interface) se comportar de formas diferentes dependendo do objeto (classe) que o está executando — por exemplo, o método 'emitirSom()' pode ter implementações diferentes nas classes Cachorro e Gato, ambas herdando de Animal."},
    {cat:'prog_oo', diff:'avancado', q:"Qual é a diferença entre uma classe abstrata e uma interface, em termos gerais de POO?",
     opts:["Não existe diferença nenhuma entre os dois conceitos","A classe abstrata pode ter métodos com implementação e atributos, enquanto a interface tradicionalmente define apenas um contrato de métodos que as classes concretas devem implementar","A interface só pode ser usada uma vez por programa","A classe abstrata é sempre mais rápida de executar que uma interface"], correct:1,
     exp:"A classe abstrata pode conter métodos já implementados e atributos, servindo como base parcial para subclasses; a interface (na visão tradicional) define apenas um contrato — os métodos que as classes que a implementam são obrigadas a fornecer, sem implementação própria."},
    {cat:'prog_oo', q:"O que é um 'construtor' em uma classe orientada a objetos?",
     opts:["Um método especial, chamado automaticamente na criação de um objeto, usado para inicializar seus atributos","Um tipo de variável que armazena apenas números inteiros","Um comando que apaga um objeto da memória","Um relatório de erros de compilação"], correct:0,
     exp:"O construtor é um método especial da classe, chamado automaticamente no momento em que um objeto é criado (instanciado), usado tipicamente para inicializar os atributos desse objeto com valores iniciais."},
    {cat:'prog_oo', diff:'expert', q:"Em POO, o que caracteriza o princípio de 'baixo acoplamento e alta coesão' como boa prática de design?",
     opts:["Fazer com que todas as classes do sistema dependam fortemente umas das outras","Fazer com que cada classe tenha uma responsabilidade bem definida (alta coesão) e dependa o mínimo possível de detalhes internos de outras classes (baixo acoplamento)","Concentrar toda a lógica do sistema em uma única classe gigante","Eliminar completamente o uso de herança no sistema"], correct:1,
     exp:"Alta coesão significa que uma classe tem responsabilidade única e bem definida; baixo acoplamento significa que as classes dependem pouco dos detalhes internos umas das outras, comunicando-se por interfaces bem definidas. Juntos, esses princípios tornam o sistema mais fácil de manter, testar e evoluir."},
    {cat:'prog_oo', q:"Quais são consideradas as quatro principais características (pilares) da programação orientada a objetos?",
     opts:["Sequência, decisão, repetição e modularização","Abstração, Encapsulamento, Herança e Polimorfismo","Compilação, Interpretação, Depuração e Execução","Hardware, Software, Firmware e Middleware"], correct:1,
     exp:"Os quatro pilares clássicos da POO são: Abstração (focar no essencial, ocultando detalhes irrelevantes), Encapsulamento (proteger o estado interno do objeto), Herança (reaproveitar código entre classes relacionadas) e Polimorfismo (mesmo método, comportamentos diferentes)."},

     exp:"A memória cache é uma memória pequena, porém muito mais rápida que a RAM, posicionada próxima (ou integrada) ao processador. Ela armazena dados e instruções de uso frequente, reduzindo a necessidade de acessar a RAM (mais lenta) repetidamente."},
    {cat:'arquitetura', diff:'avancado', q:"O que diferencia a arquitetura de processadores CISC da RISC, de forma geral?",
     opts:["CISC (Complex Instruction Set Computer) tem um conjunto de instruções mais complexo e variado; RISC (Reduced Instruction Set Computer) usa um conjunto reduzido e simplificado de instruções, favorecendo execução mais rápida por instrução","CISC e RISC são exatamente a mesma arquitetura com nomes diferentes","RISC só é usado em supercomputadores, nunca em celulares","CISC não existe mais atualmente em nenhum processador comercial"], correct:0,
     exp:"CISC utiliza um conjunto de instruções complexo, onde uma única instrução pode realizar várias operações. RISC utiliza um conjunto reduzido e simplificado de instruções, cada uma tipicamente executada em um único ciclo de clock, favorecendo maior eficiência e paralelismo — arquitetura usada, por exemplo, em processadores ARM (comuns em smartphones)."},
    {cat:'arquitetura', q:"O que é a placa-mãe (motherboard) em um computador?",

    {cat:'arquitetura', diff:'avancado', q:"O que é 'pipeline' de instruções em um processador?",

     exp:"O pipeline divide a execução de uma instrução em etapas (busca, decodificação, execução, escrita, por exemplo). Enquanto uma instrução está em uma etapa, outra instrução pode estar em uma etapa anterior simultaneamente — como uma linha de montagem — aumentando a taxa de instruções processadas por unidade de tempo."},
    {cat:'arquitetura', q:"O que significa a sigla 'SSD' e qual sua principal vantagem sobre o HD tradicional?",

     exp:"SSD (Solid State Drive) armazena dados em chips de memória flash, sem partes mecânicas móveis (diferente do HD, que usa discos giratórios e um braço mecânico). Isso torna o SSD significativamente mais rápido no acesso e leitura/escrita de dados, além de mais resistente a impactos físicos."},

    {cat:'redes', q:"O que é um endereço IP em uma rede de computadores?",

     exp:"O endereço IP (Internet Protocol) é um identificador numérico atribuído a cada dispositivo conectado a uma rede, permitindo que ele seja localizado e que outros dispositivos possam se comunicar com ele através da rede."},
    {cat:'redes', q:"Qual é a função de um roteador (router) em uma rede?",

     exp:"O roteador é o dispositivo responsável por encaminhar (rotear) pacotes de dados entre redes diferentes (por exemplo, entre a rede local e a internet), escolhendo o melhor caminho disponível até o destino do pacote."},
    {cat:'redes', q:"O que é a máscara de sub-rede (subnet mask) em uma configuração de rede IP?",
     opts:["Um dispositivo físico que protege fisicamente o roteador","Um valor que, combinado com o endereço IP, define quais bits identificam a rede e quais identificam o dispositivo (host) dentro dessa rede","Um tipo de senha de acesso ao Wi-Fi","Um protocolo de criptografia de e-mails"], correct:1,
     exp:"A máscara de sub-rede define, junto com o endereço IP, a fronteira entre a parte do endereço que identifica a rede e a parte que identifica o host (dispositivo) dentro dessa rede — fundamental para determinar se dois dispositivos estão na mesma rede local."},
    {cat:'redes', diff:'avancado', q:"Qual é a diferença fundamental entre os protocolos TCP e UDP?",
     opts:["TCP e UDP são exatamente o mesmo protocolo com nomes diferentes","TCP é orientado à conexão e garante entrega ordenada e confiável dos dados; UDP não garante entrega nem ordem, mas é mais rápido por ter menos overhead","UDP sempre garante mais segurança criptográfica que o TCP","TCP só funciona em redes locais, nunca na internet"], correct:1,
     exp:"O TCP (Transmission Control Protocol) é orientado à conexão, garantindo entrega confiável e ordenada dos pacotes (com confirmação e retransmissão em caso de perda). O UDP (User Datagram Protocol) não estabelece conexão nem garante entrega ou ordem, mas tem menor overhead, sendo usado em aplicações que priorizam velocidade, como streaming e jogos online."},
    {cat:'redes', q:"O que é um switch em uma rede local, e como ele se diferencia de um hub?",
     opts:["Switch e hub são exatamente iguais em funcionamento","O switch encaminha dados de forma inteligente apenas para a porta do destinatário correto (usando endereços MAC), enquanto o hub retransmite os dados para todas as portas indiscriminadamente","O hub é sempre mais rápido que o switch em qualquer cenário","O switch só funciona com cabos de fibra óptica"], correct:1,
     exp:"O switch é mais inteligente que o hub: ele aprende os endereços MAC dos dispositivos conectados a cada porta e encaminha os dados diretamente para a porta correta, reduzindo colisões e melhorando o desempenho. O hub simplesmente retransmite qualquer dado recebido para todas as suas portas."},
    {cat:'redes', q:"O que é DNS (Domain Name System) e para que serve?",

     exp:"O DNS funciona como uma 'lista telefônica' da internet, traduzindo nomes de domínio legíveis por humanos (como www.voltis.net.br) em endereços IP numéricos, que é como os computadores realmente localizam uns aos outros na rede."},
    {cat:'redes', diff:'avancado', q:"Em qual camada do modelo OSI atua o protocolo IP (Internet Protocol)?",

     exp:"O protocolo IP atua na Camada de Rede (camada 3) do modelo OSI, responsável pelo endereçamento lógico dos dispositivos e pelo roteamento dos pacotes entre redes diferentes até o destino final."},
    {cat:'redes', q:"O que é uma VPN (Virtual Private Network)?",

     exp:"Uma VPN cria uma conexão criptografada (um 'túnel' seguro) entre o dispositivo do usuário e uma rede remota, através de uma rede pública como a internet — protegendo os dados transmitidos contra interceptação e permitindo acesso seguro a recursos de uma rede privada à distância."},
    {cat:'fundamentos', q:"Qual é a unidade de medida da resistência elétrica?",

    {cat:'fundamentos', q:"Segundo a Primeira Lei de Ohm, qual é a relação entre tensão, corrente e resistência?",

    {cat:'fundamentos', q:"O que é potência elétrica ativa, medida em Watts?",

     exp:"Potência ativa é a taxa na qual a energia elétrica é efetivamente convertida em trabalho útil (mecânico, luminoso, térmico) por unidade de tempo, medida em Watts."},
    {cat:'fundamentos', q:"Qual é a frequência padrão da rede elétrica no Brasil?",

    {cat:'fundamentos', diff:'avancado', q:"O que é o fator de potência de um circuito elétrico?",

     exp:"O fator de potência é a razão entre a potência ativa (realmente convertida em trabalho útil) e a potência aparente (fornecida pela rede). Fator de potência baixo indica uso ineficiente da energia, com maior corrente circulando para a mesma potência útil."},
    {cat:'fundamentos', q:"O que caracteriza a corrente contínua (CC), diferente da corrente alternada (CA)?",
     opts:["A corrente contínua muda de sentido periodicamente","A corrente contínua flui sempre no mesmo sentido, com valor constante ou variável, mas sem inversão de polaridade","A corrente contínua só existe em circuitos trifásicos","Não existe diferença prática entre CC e CA"], correct:1,
     exp:"Na corrente contínua (CC), o fluxo de elétrons ocorre sempre no mesmo sentido, sem inversão de polaridade — diferente da corrente alternada (CA), que inverte o sentido periodicamente (60 vezes por segundo no Brasil)."},
    {cat:'fundamentos', q:"O que é a Segunda Lei de Ohm, que relaciona a resistência de um condutor às suas características físicas?",
     opts:["R = ρ × L / A, onde ρ é a resistividade do material, L o comprimento e A a área da seção transversal", "R = V / I apenas", "R = P / I²", "R = I² × T"], correct:0,
     exp:"A Segunda Lei de Ohm relaciona a resistência elétrica de um condutor à resistividade do material (ρ), ao seu comprimento (L) e à área de sua seção transversal (A): R = ρ × L / A — quanto mais longo e fino o condutor, maior a resistência."},
    {cat:'fundamentos', diff:'avancado', q:"O que é a energia reativa em um circuito de corrente alternada?",
     opts:["Energia efetivamente convertida em trabalho útil","Energia que oscila entre a fonte e cargas indutivas/capacitivas, sem realizar trabalho útil, mas necessária para estabelecer campos magnéticos e elétricos","Energia perdida exclusivamente em forma de calor nos condutores","Energia armazenada permanentemente em uma bateria"], correct:1,
     exp:"A energia reativa não realiza trabalho útil diretamente, mas é necessária para estabelecer os campos magnéticos (em motores e transformadores, por exemplo) e elétricos (em capacitores) do circuito — ela 'oscila' entre a fonte e a carga, sendo cobrada em excesso pelas concessionárias quando o fator de potência é baixo."},

    {cat:'circuitos', q:"Em um circuito com resistores associados em série, o que ocorre com a corrente elétrica em cada resistor?",
     opts:["A corrente se divide proporcionalmente entre os resistores","A corrente é a mesma em todos os resistores da associação","A corrente é sempre maior no primeiro resistor da série","Não é possível determinar a corrente sem saber a tensão de cada resistor"], correct:1,
     exp:"Em uma associação em série, a corrente elétrica é a mesma em todos os elementos, pois há apenas um caminho possível para o fluxo de corrente. Já a tensão se distribui proporcionalmente entre os resistores."},
    {cat:'circuitos', q:"Em uma associação de resistores em paralelo, o que permanece igual entre eles?",
     opts:["A corrente elétrica","A tensão elétrica","A resistência total do circuito","A potência dissipada"], correct:1,
     exp:"Em uma associação em paralelo, todos os elementos estão submetidos à mesma tensão (diferença de potencial), pois compartilham os mesmos dois nós de conexão. A corrente, por sua vez, se divide entre os ramos conforme a resistência de cada um."},
    {cat:'circuitos', q:"O que estabelece a Primeira Lei de Kirchhoff (Lei dos Nós)?",
     opts:["A soma das tensões em uma malha fechada é sempre igual a zero","A soma das correntes que entram em um nó é igual à soma das correntes que saem desse nó","A resistência total de um circuito série é igual à soma das resistências individuais","A potência total dissipada é sempre igual à potência fornecida pela fonte"], correct:1,
     exp:"A Primeira Lei de Kirchhoff (Lei dos Nós ou Lei das Correntes) estabelece que a soma algébrica das correntes que chegam a um nó é igual à soma das correntes que saem dele — expressando a conservação da carga elétrica."},
    {cat:'circuitos', q:"O que estabelece a Segunda Lei de Kirchhoff (Lei das Malhas)?",
     opts:["A soma algébrica das tensões ao longo de qualquer malha fechada de um circuito é igual a zero","A corrente total é sempre igual em qualquer ponto do circuito","A resistência equivalente de um paralelo é sempre menor que a menor resistência individual","A potência dissipada é proporcional apenas à corrente"], correct:0,
     exp:"A Segunda Lei de Kirchhoff (Lei das Malhas ou Lei das Tensões) estabelece que, percorrendo qualquer malha fechada de um circuito, a soma algébrica das tensões (elevações e quedas) é igual a zero — expressando a conservação de energia."},
    {cat:'circuitos', diff:'avancado', q:"Em um sistema trifásico equilibrado ligado em estrela (Y), qual é a relação entre a tensão de linha e a tensão de fase?",
     opts:["A tensão de linha é igual à tensão de fase", "A tensão de linha é igual a √3 vezes a tensão de fase","A tensão de linha é igual à metade da tensão de fase","A tensão de linha é sempre o dobro da tensão de fase"], correct:1,
     exp:"Em uma ligação estrela (Y) equilibrada, a tensão de linha (entre duas fases) é igual à tensão de fase multiplicada por √3 (aproximadamente 1,732). Por exemplo, com tensão de fase de 220V, a tensão de linha é de aproximadamente 380V."},
    {cat:'circuitos', q:"O que é um circuito RC (resistor-capacitor) em regime transitório, ao ser energizado?",
     opts:["A tensão no capacitor aumenta instantaneamente ao valor máximo assim que a fonte é ligada","A tensão no capacitor cresce gradualmente, seguindo uma curva exponencial, até atingir o valor da fonte em regime permanente","O capacitor nunca chega a se carregar completamente, independente do tempo","A corrente no circuito permanece constante durante todo o carregamento"], correct:1,
     exp:"Ao energizar um circuito RC, a tensão no capacitor cresce gradualmente seguindo uma curva exponencial (governada pela constante de tempo τ = R×C), aproximando-se assintoticamente do valor da fonte, sem nunca atingi-lo instantaneamente."},
    {cat:'circuitos', q:"Qual é a fórmula da potência elétrica em função da tensão e da corrente, em um circuito de corrente contínua?",
     opts:["P = V + I","P = V / I","P = V × I","P = V² + I²"], correct:2,
     exp:"Em corrente contínua, a potência elétrica é dada pelo produto da tensão pela corrente: P = V × I. Combinando com a Lei de Ohm, também é possível expressar P = I² × R ou P = V² / R."},
    {cat:'circuitos', diff:'avancado', q:"Ao converter uma carga trifásica de ligação estrela para triângulo (delta), mantendo a mesma impedância por fase, o que ocorre com a potência total consumida?",
     opts:["A potência total permanece exatamente a mesma em ambas as ligações","A potência total na ligação triângulo é 3 vezes maior que na ligação estrela, para a mesma impedância de fase","A potência total é sempre menor na ligação triângulo","É impossível calcular a potência sem saber o valor da resistência"], correct:1,
     exp:"Mantendo a mesma impedância de fase, a ligação em triângulo (delta) submete cada fase à tensão de linha (maior que a tensão de fase da ligação estrela), resultando em uma potência total 3 vezes maior do que a mesma carga ligada em estrela — por isso a ligação estrela-triângulo é usada para partida suave de motores."},

    {cat:'seguranca', q:"O que estabelece a NR-10 (Norma Regulamentadora nº 10)?",
     opts:["Regras de ergonomia para trabalho em escritórios","Requisitos e condições mínimas para garantir a segurança dos trabalhadores que interagem com instalações e serviços em eletricidade","Normas de transporte de cargas perigosas","Padrões de qualidade de energia da concessionária"], correct:1,
     exp:"A NR-10 estabelece os requisitos e condições mínimas de segurança para trabalhos em instalações elétricas e serviços com eletricidade, visando garantir a saúde e a segurança dos trabalhadores envolvidos direta ou indiretamente com essas atividades."},
    {cat:'seguranca', q:"O que é a Zona de Risco em uma instalação elétrica, segundo a NR-10?",
     opts:["Qualquer sala onde exista um quadro de distribuição, independente da distância", "O entorno de uma parte condutora energizada, delimitado por uma distância na qual o risco de choque elétrico é significativo","Apenas a área externa de uma subestação","Uma zona onde é proibida a presença de qualquer equipamento elétrico"], correct:1,
     exp:"A Zona de Risco é a área ao redor de uma parte condutora energizada, delimitada por uma distância dentro da qual existe risco significativo de choque elétrico, exigindo medidas de proteção e controle de acesso conforme a NR-10."},
    {cat:'seguranca', q:"Qual é a função do Equipamento de Proteção Individual (EPI) em trabalhos com eletricidade?",
     opts:["Eliminar completamente qualquer risco elétrico, tornando desnecessário o desligamento do circuito","Proteger individualmente o trabalhador contra riscos específicos (como choque elétrico e arco elétrico) durante a execução de suas atividades","Substituir a necessidade de treinamento em segurança elétrica","Servir apenas como identificação visual do cargo do trabalhador"], correct:1,
     exp:"O EPI (Equipamento de Proteção Individual) tem a função de proteger o trabalhador contra riscos específicos durante suas atividades — como luvas isolantes contra choque elétrico ou vestimentas contra arco elétrico — mas não elimina a necessidade de outras medidas de segurança, como o desligamento do circuito sempre que possível."},
    {cat:'seguranca', q:"O que significa 'desenergização' de um circuito elétrico, dentro do procedimento de segurança da NR-10?",
     opts:["Apenas desligar o interruptor de luz do ambiente","Uma sequência de ações que garante a interrupção da alimentação elétrica, o bloqueio/impedimento de reenergização, a constatação da ausência de tensão e o aterramento temporário, quando aplicável","Reduzir a tensão do circuito pela metade","Instalar apenas um disjuntor adicional no quadro"], correct:1,
     exp:"A desenergização, segundo a NR-10, não é apenas 'desligar' — é uma sequência formal de etapas: seccionamento, impedimento de reenergização (bloqueio/etiquetagem), constatação de ausência de tensão, instalação de aterramento temporário quando necessário, e proteção das partes energizadas próximas."},
    {cat:'seguranca', diff:'avancado', q:"O que é o 'arco elétrico' (arco voltaico) como risco em instalações elétricas?",
     opts:["Um tipo de proteção que impede sobrecargas no circuito","Uma descarga elétrica luminosa que ocorre entre condutores ou entre um condutor e a terra, capaz de liberar grande quantidade de energia térmica em curtíssimo tempo, causando queimaduras graves","Um dispositivo de manobra usado em subestações","Um sinônimo técnico para curto-circuito trifásico apenas"], correct:1,
     exp:"O arco elétrico é uma descarga luminosa intensa que ocorre quando a corrente elétrica flui através do ar entre condutores (ou entre condutor e terra), liberando enorme quantidade de energia térmica em frações de segundo — capaz de causar queimaduras graves e até fatais, mesmo sem contato físico direto com a parte energizada."},
    {cat:'seguranca', q:"Qual é a cor padrão utilizada para sinalização de risco elétrico (placas de advertência)?",

     exp:"A cor amarela é o padrão utilizado em sinalização de segurança para indicar risco/cuidado, incluindo placas de advertência sobre risco elétrico, conforme as normas de sinalização de segurança do trabalho (NR-26)."},
    {cat:'seguranca', diff:'avancado', q:"Segundo a NR-10, quem pode realizar intervenções em instalações elétricas energizadas?",
     opts:["Qualquer trabalhador da empresa, desde que autorizado verbalmente pelo supervisor no momento", "Apenas trabalhadores autorizados, com capacitação específica e sob condições rigorosamente controladas, sendo o trabalho em instalações energizadas uma exceção, evitada sempre que possível", "Trabalhos energizados são sempre proibidos por lei, sem exceção", "Apenas engenheiros eletricistas, nunca técnicos"], correct:1,
     exp:"A NR-10 estabelece que trabalhos em instalações energizadas devem ser evitados sempre que possível, sendo permitidos apenas em situações justificadas, por trabalhadores autorizados com capacitação específica, sob procedimentos rigorosos de segurança e uso de EPIs adequados."},

    {cat:'ferramentas', q:"Qual é a função de um multímetro em manutenção elétrica?",

     exp:"O multímetro é um instrumento de medição versátil, capaz de medir diferentes grandezas elétricas — tensão (voltímetro), corrente (amperímetro) e resistência (ohmímetro) — em um único equipamento, sendo uma das ferramentas mais essenciais em manutenção elétrica."},
    {cat:'ferramentas', q:"Para que serve um alicate amperímetro (alicate volt-amperímetro)?",

    {cat:'ferramentas', q:"O que é o megômetro (megôhmetro) e para que é utilizado?",
     opts:["Um instrumento usado para medir a resistência de isolamento de cabos e equipamentos elétricos, aplicando uma tensão elevada de teste","Um tipo de disjuntor de alta capacidade","Um instrumento exclusivo para medir a frequência da rede elétrica","Uma ferramenta usada apenas para apertar parafusos em quadros elétricos"], correct:0,
     exp:"O megômetro (ou megôhmetro) é utilizado para medir a resistência de isolamento de cabos, motores e demais equipamentos elétricos, aplicando uma tensão contínua elevada (tipicamente 500V, 1000V ou mais) — um valor baixo de resistência de isolamento indica risco de falha ou fuga de corrente."},

    {cat:'prog_oo', q:"O que é um 'atributo' de uma classe, na programação orientada a objetos?",

    {cat:'prog_oo', q:"O que é 'sobrecarga de método' (method overloading) na programação orientada a objetos?",

    {cat:'prog_oo', diff:'avancado', q:"O que é 'sobrescrita de método' (method overriding), diferente de sobrecarga?",

    {cat:'prog_oo', q:"Em POO, o que significa o modificador de acesso 'privado' (private) aplicado a um atributo de uma classe?",

    {cat:'programacao', q:"O que é um 'compilador', em relação a uma linguagem de programação?",

     exp:"O compilador traduz todo o código-fonte de uma linguagem para código de máquina (ou código intermediário) ANTES da execução, gerando um arquivo executável separado — diferente de um interpretador, que traduz e executa o código linha por linha, sem gerar um executável prévio."},
    {cat:'programacao', q:"Qual é a diferença fundamental entre uma linguagem compilada e uma linguagem interpretada?",

     exp:"Linguagens compiladas (como C e C++) são totalmente traduzidas para código de máquina antes da execução, gerando um executável. Linguagens interpretadas (como Python e JavaScript, tradicionalmente) são traduzidas e executadas linha por linha por um interpretador, sem gerar um executável separado previamente."},

    {cat:'programacao', diff:'avancado', q:"O que é 'tipagem estática' em uma linguagem de programação, em oposição à 'tipagem dinâmica'?",

    {cat:'protecao', q:"O que é a função de proteção de sobrecorrente instantânea, identificada pelo código ANSI 50?",
     opts:["Atua com temporização proporcional à corrente, quanto maior a corrente, mais rápido atua","Atua sem temporização intencional, de forma quase instantânea, quando a corrente ultrapassa um valor ajustado, tipicamente usada para curtos-circuitos próximos","Mede exclusivamente a tensão do sistema","Atua apenas em corrente contínua"], correct:1,

    {cat:'protecao', q:"O que caracteriza a função de proteção de sobrecorrente temporizada, código ANSI 51?",

    {cat:'protecao', q:"O que é 'seletividade' em um sistema de proteção elétrica?",

     exp:"Seletividade é a capacidade do sistema de proteção de identificar e isolar apenas a seção onde ocorreu o defeito, minimizando a área afetada e mantendo o restante do sistema elétrico em operação normal — obtida através da coordenação correta entre os diversos dispositivos de proteção."},
    {cat:'protecao', diff:'avancado', q:"O que é a 'proteção diferencial percentual' (código ANSI 87), aplicada a um transformador ou gerador?",

    {cat:'protecao', diff:'avancado', q:"Por que o secundário de um Transformador de Corrente (TC) NUNCA deve ser deixado em circuito aberto enquanto o primário está energizado?",

    {cat:'protecao', q:"Qual é a função de um Transformador de Potencial (TP) em um esquema de proteção e medição?",

    {cat:'protecao', q:"Qual é a diferença fundamental entre um fusível e um disjuntor, como dispositivos de proteção contra sobrecorrente?",

    {cat:'protecao', q:"O que é a função de proteção de subtensão, código ANSI 27?",

    {cat:'protecao', q:"O que é a função de proteção de sobretensão, código ANSI 59?",

    {cat:'protecao', diff:'avancado', q:"O que é a proteção de potência reversa (código ANSI 32), usada tipicamente em geradores síncronos operando em paralelo com a rede?",
     opts:["Detecta quando o fluxo de potência se inverte (o gerador passa a consumir potência da rede, em vez de fornecer), condição anormal que pode indicar perda de força motriz da máquina primária","Mede exclusivamente a corrente de excitação do gerador","Atua apenas contra sobrecorrente de curto-circuito trifásico","É usada somente em motores de indução monofásicos"], correct:0,
     exp:"A proteção de potência reversa (ANSI 32) detecta quando o fluxo de potência ativa se inverte — por exemplo, quando um gerador síncrono perde sua fonte de energia motriz (turbina, motor) mas continua conectado à rede, passando a operar como motor síncrono, consumindo potência da rede. Essa condição pode danificar a máquina primária e por isso deve ser detectada e isolada rapidamente."},
    {cat:'protecao', q:"Qual é a função da proteção de sequência negativa (desequilíbrio de fases), código ANSI 46, aplicada a motores e geradores?",
     opts:["Detecta desequilíbrio entre as correntes das três fases, condição que causa sobreaquecimento anormal no rotor de máquinas girantes","Mede apenas a tensão contínua do sistema","Atua exclusivamente contra descargas atmosféricas","É usada somente para proteger disjuntores de baixa tensão"], correct:0,
     exp:"A proteção de sequência negativa (ANSI 46) detecta desequilíbrio entre as correntes das três fases (como o causado pela perda de uma fase, ou cargas desequilibradas). Esse desequilíbrio induz correntes na frequência dupla no rotor de máquinas girantes, causando sobreaquecimento localizado que pode danificar o equipamento se não for detectado a tempo."},
    {cat:'protecao', q:"O que é um DPS (Dispositivo de Proteção contra Surtos)?",

    {cat:'protecao', q:"O que caracteriza a curva de atuação 'tempo inverso' de um relé de sobrecorrente?",

     exp:"Na curva de tempo inverso, o tempo de atuação do relé diminui à medida que a corrente de falta aumenta — faltas mais severas (correntes mais altas) são eliminadas mais rapidamente, enquanto sobrecargas moderadas (correntes próximas ao limite) levam mais tempo para provocar a atuação, permitindo coordenação seletiva entre diferentes níveis de proteção."},
    {cat:'protecao', diff:'avancado', q:"O que é 'seletividade lógica' (ou intertravamento de proteção), como técnica avançada de coordenação?",

     exp:"Na seletividade lógica, os relés de proteção trocam sinais de comunicação entre si: o relé mais próximo da falta, ao detectar a condição anormal, envia um sinal de bloqueio para os relés a montante, impedindo (ou atrasando) sua atuação. Isso permite uma coordenação mais rápida e precisa do que depender apenas de margens de tempo fixas entre curvas de atuação."},
    {cat:'protecao', q:"Por que a proteção de um transformador de potência normalmente combina mais de uma função de proteção (como diferencial 87, sobrecorrente 50/51 e imagem térmica 49)?",
     opts:["Porque uma única função de proteção nunca é confiável, exigindo redundância exagerada sem propósito técnico","Porque diferentes tipos de falta (interna, externa, sobrecarga térmica) exigem diferentes princípios de detecção, e a combinação de funções garante proteção mais completa e confiável do equipamento","Porque a lei exige obrigatoriamente pelo menos cinco funções de proteção em qualquer transformador","Porque cada função de proteção deve atuar simultaneamente para qualquer tipo de falta"], correct:1,
     exp:"Diferentes tipos de anormalidade exigem diferentes princípios de detecção: a função diferencial (87) detecta faltas internas ao transformador; a sobrecorrente (50/51) protege contra faltas externas e sobrecargas severas; a imagem térmica (49) protege contra sobrecarga térmica sustentada. Combinar essas funções garante uma proteção mais completa e confiável do que depender de uma única função isolada."},
    {cat:'protecao', q:"O que é o relé de proteção Buchholz, utilizado em transformadores imersos em óleo?",
     opts:["Um relé puramente elétrico que mede apenas a corrente do enrolamento primário","Um dispositivo mecânico que detecta a formação de gases (produzidos por faltas internas de baixa intensidade) ou fluxo brusco de óleo (indicando faltas mais severas) dentro do tanque do transformador","Um tipo de disjuntor usado exclusivamente em baixa tensão","Um sinônimo técnico para transformador de corrente"], correct:1,
     exp:"O relé Buchholz é um dispositivo mecânico instalado na tubulação entre o tanque principal e o conservador de óleo de um transformador. Ele detecta a formação de gases (gerados por faltas incipientes, de baixa intensidade, dentro do óleo) e também o fluxo brusco de óleo causado por faltas mais severas — atuando como alarme ou disparo, conforme a gravidade detectada."},
    {cat:'protecao', q:"O que é a 'imagem térmica' (função ANSI 49), aplicada à proteção de motores e transformadores?",
     opts:["Uma fotografia térmica tirada periodicamente do equipamento por um técnico","Um modelo matemático que estima a temperatura interna do enrolamento do equipamento, com base na corrente medida ao longo do tempo, atuando antes que a temperatura real atinja um nível danoso ao isolamento","Uma função que mede exclusivamente a tensão de alimentação do motor","Um sinônimo de proteção diferencial percentual"], correct:1,
     exp:"A função de imagem térmica (ANSI 49) utiliza um modelo matemático (baseado na corrente medida ao longo do tempo, considerando as constantes térmicas do equipamento) para estimar a temperatura interna do enrolamento, sem necessidade de sensores físicos internos. Ela atua para prevenir que o equipamento seja submetido a sobrecarga térmica sustentada, protegendo o isolamento contra degradação."},
    {cat:'protecao', q:"O que é a 'proteção contra falta à terra' (código ANSI 50N/51N ou 50G/51G) em um sistema elétrico?",
     opts:["Protege exclusivamente contra sobretensões atmosféricas","Detecta correntes de fuga para a terra (que normalmente deveriam ser próximas de zero em condições normais), indicando uma falta de isolamento entre um condutor energizado e a terra","Mede apenas a tensão de linha entre duas fases","É aplicável somente a circuitos de corrente contínua"], correct:1,
     exp:"A proteção de falta à terra monitora a corrente residual (soma vetorial das correntes de fase, ou corrente medida em um TC específico no neutro), que em condições normais é próxima de zero. Uma corrente significativa nesse ponto indica uma falta de isolamento entre um condutor energizado e a terra, exigindo atuação rápida da proteção."},
    {cat:'protecao', diff:'expert', q:"Em um sistema com neutro aterrado através de uma resistência de alta impedância (aterramento de alta impedância), qual é o principal objetivo dessa configuração em relação a faltas à terra?",
     opts:["Aumentar deliberadamente a corrente de falta à terra para acionar a proteção o mais rápido possível","Limitar a corrente de falta à terra a um valor baixo e controlado, reduzindo danos ao equipamento e permitindo, em alguns casos, a continuidade operacional temporária mesmo durante uma falta à terra, até que a manutenção seja programada","Eliminar completamente a necessidade de qualquer proteção de falta à terra","Impedir que o sistema opere em corrente alternada"], correct:1,
     exp:"O aterramento de alta impedância limita deliberadamente a corrente de falta à terra a um valor baixo (tipicamente na faixa de alguns ampères), reduzindo os danos causados por arcos elétricos no ponto de falta e, em determinadas configurações industriais, permitindo a continuidade operacional temporária do sistema até que uma manutenção programada possa ser realizada — diferente de sistemas solidamente aterrados, onde a corrente de falta é elevada e a atuação da proteção deve ser imediata."},
    {cat:'protecao', q:"O que é o 'tempo morto' (dead time) em um esquema de religamento automático?",
     opts:["O tempo total que o religador permanece permanentemente desligado após a primeira falta","O intervalo de tempo entre a abertura do disjuntor/religador (após detectar a falta) e a tentativa de fechamento automático seguinte, permitindo que uma falta transitória (como um arco no ar) se extinga naturalmente antes de tentar restabelecer o fornecimento","Um sinônimo de tempo de vida útil do disjuntor","O tempo necessário para trocar um fusível queimado"], correct:1,
     exp:"O tempo morto é o intervalo entre a abertura do dispositivo de proteção (após detectar a falta) e sua próxima tentativa de fechamento automático. Esse intervalo permite que faltas transitórias — como um arco elétrico causado por contato momentâneo com um galho de árvore — se extingam naturalmente antes que o sistema tente restabelecer o fornecimento de energia."},
    {cat:'protecao', q:"Qual é a diferença entre uma falta 'transitória' e uma falta 'permanente' em um sistema elétrico, do ponto de vista da proteção?",
     opts:["Não existe diferença prática entre os dois tipos de falta","A falta transitória se extingue naturalmente e o sistema pode ser restabelecido normalmente após um curto intervalo (por isso o religamento automático é útil); a falta permanente persiste, exigindo que o trecho afetado permaneça desligado até reparo","A falta permanente sempre tem magnitude de corrente menor que a transitória","A falta transitória só pode ocorrer em sistemas de corrente contínua"], correct:1,
     exp:"Uma falta transitória (como um contato momentâneo de um galho de árvore, ou uma descarga atmosférica) se extingue naturalmente após a interrupção do circuito, permitindo que o sistema seja religado com sucesso. Uma falta permanente (como um cabo rompido ou um curto-circuito sólido) persiste mesmo após a interrupção, e qualquer tentativa de religamento resultará em nova atuação da proteção, exigindo reparo físico do trecho afetado."},
    {cat:'protecao', q:"O que é a proteção de frequência (subfrequência, código ANSI 81U), aplicada em sistemas de geração?",
     opts:["Atua quando a frequência do sistema cai abaixo de um valor mínimo ajustado, condição que pode indicar sobrecarga do sistema de geração em relação à demanda de carga conectada","Mede apenas a tensão contínua da bateria de um no-break","Atua exclusivamente contra curto-circuito trifásico sólido","É usada somente em sistemas de iluminação pública"], correct:0,
     exp:"A proteção de subfrequência (ANSI 81U) monitora a frequência do sistema e atua quando ela cai abaixo de um valor mínimo — situação que tipicamente ocorre quando a capacidade de geração disponível é insuficiente para atender à demanda de carga conectada, podendo desencadear esquemas automáticos de corte de carga (load shedding) para restabelecer o equilíbrio entre geração e consumo."},
    {cat:'protecao', diff:'avancado', q:"O que é a 'margem de coordenação' (ou intervalo de coordenação) entre dois relés de proteção em série?",
     opts:["Um intervalo de tempo de segurança inserido entre as curvas de atuação de dois dispositivos em série, garantindo que o dispositivo a jusante tenha tempo suficiente para atuar e eliminar a falta antes que o dispositivo a montante também atue","A distância física mínima exigida entre dois disjuntores em uma subestação","Um sinônimo de corrente de curto-circuito máxima do sistema","Um parâmetro aplicável apenas a sistemas de corrente contínua"], correct:0,
     exp:"A margem de coordenação é o intervalo de tempo de segurança (tipicamente entre 0,2 e 0,4 segundos, dependendo da tecnologia dos disjuntores envolvidos) inserido entre as curvas de tempo x corrente de dois dispositivos de proteção em série. Essa margem garante que o dispositivo mais próximo da falta (a jusante) tenha tempo suficiente para atuar e eliminar a falta antes que o dispositivo a montante também comece a atuar, preservando a seletividade do sistema."},
    {cat:'protecao', q:"Em uma subestação industrial, qual é a finalidade de se realizar periodicamente o 'teste de proteção' (teste de relés e coordenogramas)?",
     opts:["Verificar exclusivamente a cor da fiação do painel de proteção","Confirmar que os relés estão ajustados corretamente e atuando dentro dos parâmetros de tempo e corrente projetados, garantindo que a coordenação seletiva do sistema continue válida ao longo do tempo","Substituir integralmente o sistema de aterramento da subestação","Aumentar artificialmente a corrente de curto-circuito disponível no sistema"], correct:1,
     exp:"O teste periódico de proteção verifica se os relés continuam ajustados corretamente e atuando dentro dos parâmetros de tempo e corrente projetados no estudo de coordenação — garantindo que, ao longo do tempo (por desgaste, alterações no sistema, ou desajustes), a seletividade e a confiabilidade da proteção permaneçam válidas, evitando desligamentos desnecessários ou falhas em eliminar faltas reais."},
    {cat:'protecao', q:"O que é o 'estudo de coordenação e seletividade' realizado na fase de projeto de um sistema elétrico industrial?",
     opts:["Uma análise que define a cor de identificação dos cabos elétricos do projeto","Uma análise técnica que define os ajustes de cada dispositivo de proteção (disjuntores, relés, fusíveis) do sistema, garantindo que, em caso de falta, apenas o trecho mais próximo do defeito seja isolado, com o mínimo de área afetada","Um documento que trata exclusivamente do dimensionamento de condutores pela NBR 5410","Um relatório financeiro sobre o custo dos equipamentos de proteção"], correct:1,
     exp:"O estudo de coordenação e seletividade é uma análise técnica (tipicamente feita através de curvas tempo x corrente sobrepostas) que define os ajustes de cada dispositivo de proteção no sistema elétrico, garantindo que, em caso de falta, o dispositivo mais próximo do defeito atue primeiro, isolando apenas o trecho afetado e minimizando o impacto no restante da instalação."},
    {cat:'arquitetura', q:"O que é a ULA (Unidade Lógica e Aritmética) dentro da CPU?",

     exp:"A ULA (Unidade Lógica e Aritmética) é o componente da CPU responsável por executar as operações aritméticas (como soma e subtração) e lógicas (como AND, OR, comparações) exigidas pelas instruções do programa."},
    {cat:'arquitetura', q:"O que são registradores, dentro da arquitetura de um processador?",
     opts:["Pequenas unidades de memória extremamente rápidas, localizadas dentro da própria CPU, usadas para armazenar temporariamente dados e endereços durante a execução de instruções","Um tipo de memória externa e lenta usada para backup","Dispositivos de entrada de dados como teclado e mouse","Um tipo específico de disco rígido"], correct:0,
     exp:"Registradores são pequenas unidades de memória extremamente rápidas, localizadas dentro da própria CPU, usadas para armazenar temporariamente dados, endereços e resultados intermediários durante a execução das instruções — sendo a memória mais rápida disponível na hierarquia do sistema."},
    {cat:'arquitetura', q:"Qual é a sequência correta do ciclo básico de execução de uma instrução pela CPU (ciclo fetch-decode-execute)?",

     exp:"O ciclo básico de instrução segue a sequência: Fetch (busca a instrução na memória, usando o endereço indicado pelo contador de programa), Decode (decodifica o que a instrução representa) e Execute (executa a operação correspondente, usando a ULA e/ou registradores)."},
    {cat:'arquitetura', q:"O que é a arquitetura de von Neumann, um dos modelos fundamentais de organização de computadores?",
     opts:["Um modelo em que dados e instruções de programa compartilham a mesma memória e o mesmo barramento de acesso","Um modelo exclusivo para supercomputadores modernos","Um tipo de rede de computadores sem fio","Um protocolo de comunicação entre periféricos USB"], correct:0,
     exp:"Na arquitetura de von Neumann, dados e instruções de programa compartilham a mesma memória e o mesmo barramento de acesso — é o modelo mais comum na maioria dos computadores pessoais atuais, embora crie uma limitação conhecida como 'gargalo de von Neumann', já que dados e instruções competem pelo mesmo canal de acesso à memória."},
    {cat:'arquitetura', diff:'avancado', q:"Em que a arquitetura Harvard se diferencia da arquitetura de von Neumann?",

     exp:"Na arquitetura Harvard, dados e instruções são armazenados em memórias fisicamente separadas, cada uma com seu próprio barramento — permitindo que a CPU busque uma instrução e acesse dados simultaneamente, evitando o gargalo de acesso compartilhado da arquitetura de von Neumann. É comum em microcontroladores e processadores de sinal digital (DSPs)."},
    {cat:'arquitetura', q:"O que é a hierarquia de memória em um sistema computacional?",
     opts:["Uma classificação por preço dos componentes de hardware", "A organização dos diferentes tipos de memória (registradores, cache, RAM, armazenamento secundário) em níveis, equilibrando velocidade, custo e capacidade — memórias mais rápidas e caras ficam mais próximas da CPU, com menor capacidade", "Um sinônimo de sistema operacional", "A ordem de instalação dos componentes na placa-mãe"], correct:1,
     exp:"A hierarquia de memória organiza os diferentes tipos de memória em níveis, do mais rápido/caro/menor (registradores, depois cache L1/L2/L3) ao mais lento/barato/maior (RAM, e depois armazenamento secundário como SSD/HD) — equilibrando desempenho e custo, já que memórias rápidas o suficiente para acompanhar a CPU são caras demais para uso em grande capacidade."},
    {cat:'arquitetura', q:"O que caracteriza a memória cache L1, em comparação com a cache L2 e L3?",
     opts:["A L1 é a maior em capacidade entre as três, mas a mais lenta", "A L1 é a mais próxima do núcleo do processador, geralmente a menor em capacidade, porém a mais rápida entre os níveis de cache", "L1, L2 e L3 têm exatamente a mesma velocidade e capacidade", "A cache L1 está sempre localizada fora do processador, na placa-mãe"], correct:1,
     exp:"A cache L1 é a mais próxima do núcleo do processador (geralmente integrada a cada núcleo individualmente), sendo a mais rápida, porém com menor capacidade. As caches L2 e L3 são progressivamente maiores em capacidade, porém mais distantes do núcleo e um pouco mais lentas — formando níveis intermediários entre os registradores e a memória RAM."},
    {cat:'arquitetura', q:"O que é DMA (Direct Memory Access) em um sistema computacional?",

     exp:"O DMA (Direct Memory Access) permite que determinados periféricos transfiram dados diretamente de/para a memória RAM, sem que a CPU precise gerenciar cada byte transferido individualmente — isso libera a CPU para executar outras tarefas durante a transferência, aumentando a eficiência geral do sistema."},
    {cat:'arquitetura', q:"O que é uma interrupção (interrupt) em um sistema computacional?",

    {cat:'arquitetura', q:"O que caracteriza um processador multicore (multinúcleo)?",

    {cat:'arquitetura', q:"Qual é a principal diferença de propósito entre uma CPU e uma GPU (Graphics Processing Unit)?",

    {cat:'arquitetura', q:"O que é a BIOS (ou seu sucessor moderno, a UEFI) em um computador?",

    {cat:'arquitetura', q:"O que é o sistema de numeração binário, e por que é fundamental na arquitetura de computadores?",

    {cat:'arquitetura', q:"Quantos bits compõem 1 byte, na convenção padrão de computação?",
