  const OPT_STYLE = ['a','b','c','d'];
  const OPT_ICON = ['▲','◆','●','■'];
  const SOLO_TIME_DEFAULT = 15;   // seconds, solo mode
  const ROOM_TIME_DEFAULT = 20;   // seconds, multiplayer mode (a bit more to allow for network/poll lag)
  const TIME_CHOICES = [10,15,20,30];
  const LOBBY_POLL = 2000;
  const GAME_POLL = 1500;

  function poolForCategories(cats, diffs){
    // cats: array of category ids selected. diffs: array of difficulty ids selected ('padrao'|'avancado'|'expert').
    diffs = diffs || ['padrao','avancado','expert'];
    const idx = [];
    QUESTIONS.forEach((q,i)=>{
      if(!cats.includes(q.cat)) return;
      const qd = q.diff || 'padrao';
      if(!diffs.includes(qd)) return;
      idx.push(i);
    });
    return idx;
  }
  function countChoicesFor(poolLen){
    const base = [5,10,15,20];
    let opts = base.filter(n=>n<poolLen);
    opts.push(poolLen);
    return [...new Set(opts)].sort((a,b)=>a-b);
  }

  // Renders category checkboxes + difficulty checkboxes + question-count select + time select into `container`.
  // Returns a getConfig() function -> {cats:[...], diffs:[...], count:Number, time:Number(seconds)} or null if invalid.
  function buildConfigUI(container, defaults){
    defaults = defaults || {};
    const selectedAreas = new Set(defaults.areas || AREAS.map(a=>a.id));
    const selectedCats = new Set(defaults.cats || CATEGORIES.map(c=>c.id));
    const selectedDiffs = new Set(defaults.diffs || ['padrao','avancado']);
    const box = el(`
      <div>
        <label class="field-label field-gap">Área</label>
        <div class="avatar-grid" id="areaGrid" style="grid-template-columns:repeat(2,1fr);"></div>
        <label class="field-label field-gap">Categorias</label>
        <div class="avatar-grid" id="catGrid" style="grid-template-columns:repeat(2,1fr);"></div>
        <label class="field-label field-gap">Nível de dificuldade</label>
        <div class="avatar-grid" id="diffGrid" style="grid-template-columns:repeat(3,1fr);"></div>
        <label class="field-label field-gap">Quantidade de perguntas</label>
        <select class="nick" id="countSelect"></select>
        <label class="field-label field-gap">Tempo por pergunta</label>
        <select class="nick" id="timeSelect">
          ${TIME_CHOICES.map(t=>`<option value="${t}" ${t===(defaults.time||ROOM_TIME_DEFAULT)?'selected':''}>${t} segundos</option>`).join('')}
        </select>
        <div id="catWarn"></div>
      </div>
    `);
    container.appendChild(box);
    const areaGrid = box.querySelector('#areaGrid');
    const catGrid = box.querySelector('#catGrid');
    const diffGrid = box.querySelector('#diffGrid');
    const countSelect = box.querySelector('#countSelect');
    const catWarn = box.querySelector('#catWarn');

    function refreshCountOptions(){
      const pool = poolForCategories([...selectedCats], [...selectedDiffs]);
      countSelect.innerHTML='';
      if(pool.length===0){
        catWarn.innerHTML = '<div class="feedback bad">Nenhuma pergunta encontrada para essa combinação de área, categoria e dificuldade. Tente ajustar as opções.</div>';
        return;
      }
      catWarn.innerHTML='';
      const choices = countChoicesFor(pool.length);
      choices.forEach(n=>{
        const label = n===pool.length ? `Todas (${n})` : `${n} perguntas`;
        const opt = document.createElement('option');
        opt.value = n; opt.textContent = label;
        if(defaults.count && defaults.count===n) opt.selected = true;
        countSelect.appendChild(opt);
      });
      if(!defaults.count) countSelect.value = choices[choices.length-1];
    }

    function refreshCategoryGrid(){
      // Keep only categories that belong to a currently selected area.
      [...selectedCats].forEach(id=>{
        const cat = CATEGORIES.find(c=>c.id===id);
        if(cat && !selectedAreas.has(cat.area)) selectedCats.delete(id);
      });
      catGrid.innerHTML='';
      CATEGORIES.filter(c=>selectedAreas.has(c.area)).forEach(c=>{
        const total = QUESTIONS.filter(q=>q.cat===c.id).length;
        const card = el(`
          <div class="avatar-card ${selectedCats.has(c.id)?'selected':''}" data-cat="${c.id}" style="padding:12px 8px;">
            <div class="avatar-emoji" style="font-size:24px;">${c.emoji}</div>
            <div class="avatar-name">${c.label}</div>
            <div class="loading-note" style="margin-top:2px;">${total} perg.</div>
          </div>
        `);
        card.addEventListener('click', ()=>{
          if(selectedCats.has(c.id)) selectedCats.delete(c.id); else selectedCats.add(c.id);
          card.classList.toggle('selected');
          refreshCountOptions();
        });
        catGrid.appendChild(card);
      });
      refreshCountOptions();
    }

    AREAS.forEach(a=>{
      const total = QUESTIONS.filter(q=>{ const cat = CATEGORIES.find(c=>c.id===q.cat); return cat && cat.area===a.id; }).length;
      const card = el(`
        <div class="avatar-card ${selectedAreas.has(a.id)?'selected':''}" data-area="${a.id}" style="padding:14px 8px;">
          <div class="avatar-emoji" style="font-size:26px;">${a.emoji}</div>
          <div class="avatar-name">${a.label}</div>
          <div class="loading-note" style="margin-top:2px;">${total} perg.</div>
        </div>
      `);
      card.addEventListener('click', ()=>{
        if(selectedAreas.has(a.id)){
          if(selectedAreas.size===1) return; // keep at least one area selected
          selectedAreas.delete(a.id);
        } else selectedAreas.add(a.id);
        card.classList.toggle('selected');
        refreshCategoryGrid();
      });
      areaGrid.appendChild(card);
    });

    DIFFICULTIES.forEach(d=>{
      const total = QUESTIONS.filter(q=>(q.diff||'padrao')===d.id).length;
      const card = el(`
        <div class="avatar-card ${selectedDiffs.has(d.id)?'selected':''}" data-diff="${d.id}" style="padding:12px 6px;">
          <div class="avatar-emoji" style="font-size:22px;">${d.emoji}</div>
          <div class="avatar-name">${d.label}</div>
          <div class="loading-note" style="margin-top:2px;">${total} perg.</div>
        </div>
      `);
      card.addEventListener('click', ()=>{
        if(selectedDiffs.has(d.id)) selectedDiffs.delete(d.id); else selectedDiffs.add(d.id);
        card.classList.toggle('selected');
        refreshCountOptions();
      });
      diffGrid.appendChild(card);
    });

    refreshCategoryGrid();

    return function getConfig(){
      const cats = [...selectedCats];
      const diffs = [...selectedDiffs];
      const areas = [...selectedAreas];
      const pool = poolForCategories(cats, diffs);
      if(pool.length===0) return null;
      return { areas, cats, diffs, count: Number(countSelect.value), time: Number(box.querySelector('#timeSelect').value) };
    };
  }

  // ---------------- Utils ----------------
  function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function shuffledIndices(n){ const arr=Array.from({length:n},(_,i)=>i); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  function genId(){ return 'p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function genPin(){ return String(Math.floor(100000+Math.random()*900000)); }

  const HAS_ARTIFACT_STORAGE = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
  let fbDb = null, fbReady = false, fbWarned = false;

  function initFirebase(){
    if(fbReady) return true;
    if(FIREBASE_CONFIG.apiKey === 'SUBSTITUA_AQUI'){
      if(!fbWarned){ console.warn('[ByteVolt] Firebase ainda não configurado — edite FIREBASE_CONFIG no HTML para ativar o multiplayer neste domínio.'); fbWarned = true; }
      return false;
    }
    try{
      if(typeof firebase === 'undefined'){ console.warn('[ByteVolt] SDK do Firebase não carregou (verifique a conexão/CDN).'); return false; }
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      fbDb = firebase.database();
      fbReady = true;
      return true;
    }catch(e){ console.error('[ByteVolt] Falha ao iniciar o Firebase:', e); return false; }
  }

  // "game:123456:player:abc" -> "game/123456/player/abc" (Realtime Database uses path segments)
  function keyToPath(key){ return key.split(':').filter(Boolean).join('/'); }

  async function storeGet(key){
    if(HAS_ARTIFACT_STORAGE){
      try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    if(!initFirebase()) return null;
    try{ const snap = await fbDb.ref(keyToPath(key)).once('value'); return snap.exists() ? snap.val() : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, obj){
    if(HAS_ARTIFACT_STORAGE){
      try{ await window.storage.set(key, JSON.stringify(obj), true); return true; }
      catch(e){ return false; }
    }
    if(!initFirebase()) return false;
    try{ await fbDb.ref(keyToPath(key)).set(obj); return true; }
    catch(e){ return false; }
  }
  async function storeListKeys(prefix){
    if(HAS_ARTIFACT_STORAGE){
      try{ const r = await window.storage.list(prefix, true); return (r && r.keys) ? r.keys : []; }
      catch(e){ return []; }
    }
    if(!initFirebase()) return [];
    try{
      const cleanPrefix = prefix.endsWith(':') ? prefix.slice(0,-1) : prefix;
      const snap = await fbDb.ref(keyToPath(cleanPrefix)).once('value');
      if(!snap.exists()) return [];
      const val = snap.val();
      const basePrefix = prefix.endsWith(':') ? prefix : prefix+':';
      return Object.keys(val).map(childId => basePrefix + childId);
    }catch(e){ return []; }
  }
  // Personal (non-shared) variants — used for things like the theme preference, which is per-device, not per-room.
  // On your own site these use localStorage (a real browser, not an artifact sandbox, so it's safe here).
  async function storeGetPersonal(key){
    if(HAS_ARTIFACT_STORAGE){
      try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    try{ const raw = localStorage.getItem('bytevolt:'+key); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  async function storeSetPersonal(key, obj){
    if(HAS_ARTIFACT_STORAGE){
      try{ await window.storage.set(key, JSON.stringify(obj), false); return true; }
      catch(e){ return false; }
    }
    try{ localStorage.setItem('bytevolt:'+key, JSON.stringify(obj)); return true; }
    catch(e){ return false; }
  }

  function updateWire(fill, spark, t, duration){
    duration = duration || ROOM_TIME_DEFAULT;
    const pct = Math.max(0,(t/duration)*100);
    fill.style.width = pct+'%'; spark.style.left = pct+'%';
    if(pct<33) fill.style.background='linear-gradient(90deg,#ef4b5f,#ff8a3d)';
    else if(pct<66) fill.style.background='linear-gradient(90deg,#ffcc33,#ff8a3d)';

  }

  function soloHandleAnswer(choice, wrap, q){
    if(state.answered) return;
    state.answered=true; clearInterval(tickTimer);
    const isCorrect = choice===q.correct;
    const timeLeft = state.timeLeft;
    let pts=0;
    if(isCorrect){
      pts = 700 + Math.round((timeLeft/state.timePerQ)*300) + Math.min(state.streak,3)*10;
      state.streak+=1; state.best_streak=Math.max(state.best_streak,state.streak); state.correctCount+=1;
    } else state.streak=0;
    state.score += pts;
    const buttons = wrap.querySelectorAll('.opt');
    buttons.forEach((b,i)=>{ b.disabled=true; if(i===q.correct) b.classList.add('correct'); else if(i===choice) b.classList.add('wrong'); else b.classList.add('dim'); });
    const scoreVal = wrap.querySelector('#scoreVal'); if(scoreVal) scoreVal.textContent=state.score;
    const slot = wrap.querySelector('#feedbackSlot');
    const fb = el(`<div class="feedback ${isCorrect?'ok':'bad'}"><b>${isCorrect?'✅ Certo! +'+pts+' pts':(choice===-1?'⏱️ Tempo esgotado!':'❌ Não foi dessa vez.')}</b><br/>${escapeHtml(q.exp)}</div>`);
    slot.appendChild(fb);
    if(isCorrect && state.streak>=3) showStreakPop(state.streak);
    if(isCorrect) burstParticles(['✨','🎉','⭐']); else wrap.querySelector('.card').classList.add('shake');
    const nextWrap = el(`<div class="btn-row"></div>`);
    const isLast = state.qIndex >= state.totalQ-1;
    const nextBtn = el(`<button class="btn btn-primary">${isLast?'Ver resultado 🏁':'Próxima pergunta →'}</button>`);

    nextWrap.appendChild(nextBtn); slot.appendChild(nextWrap);
  }

  function fireworkBurst(x, y){
    const holder = document.createElement('div');
    holder.className = 'firework';
    holder.style.left = x+'px'; holder.style.top = y+'px';
    document.body.appendChild(holder);
    const n = 12;
    for(let i=0;i<n;i++){
      const angle = (i/n)*2*Math.PI + Math.random()*0.3;
      const dist = 36+Math.random()*34;
      const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
      s.style.setProperty('--dx', dx+'px');
      s.style.setProperty('--dy', dy+'px');
      holder.appendChild(s);
    }
    setTimeout(()=>holder.remove(), 950);
  }

      const keys = Object.keys(state.players);
      let answered=0;
      for(const id of keys){
        const doc = await storeGet(id);
        if(doc){ state.players[id]=doc; if(doc.answered && doc.answered[state.meta.qIndex]) answered++; }
      }
      const c = wrap.querySelector('#answeredCount'); if(c) c.textContent = answered;
    }
    refreshCount();
    pollTimer = setInterval(refreshCount, GAME_POLL);
  }

  let revealed = false;
  async function hostGoReveal(q){
    if(revealed) return; revealed = true;
    clearTimers();
    // final refresh of all player docs for this question
    const ids = Object.keys(state.players);
    for(const id of ids){ const doc = await storeGet(id); if(doc) state.players[id]=doc; }
    state.meta.phase='reveal';
    await storeSet(`game:${state.pin}:meta`, state.meta);
    revealed = false;
    state.screen='host-reveal';
    render();
  }

  function hostRenderReveal(){
    app.innerHTML='';
    const q = QUESTIONS[state.meta.order[state.meta.qIndex]];
    const ids = Object.keys(state.players);
    const counts=[0,0,0,0]; let correctCount=0;
    ids.forEach(id=>{
      const doc = state.players[id];
      const ans = doc.answered && doc.answered[state.meta.qIndex];
      if(ans){ if(ans.choice>=0) counts[ans.choice]++; if(ans.correct) correctCount++; }
    });
    const total = ids.length || 1;
    const colors = ['var(--a)','var(--b)','var(--c)','var(--d)'];
    const isLast = state.meta.qIndex >= state.meta.total-1;

    const sorted = ids.map(id=>state.players[id]).sort((x,y)=>y.score-x.score).slice(0,5);

    const wrap = el(`
      <div class="wrap wide">
        <div class="card">
          <div class="qnum" style="text-align:center;">✅ RESPOSTA CORRETA</div>
          <div class="qtext" style="text-align:center;margin-bottom:18px;">${escapeHtml(q.opts[q.correct])}</div>
          <div id="barsSlot"></div>
          <div class="feedback ok" style="margin-top:10px;"><b>${correctCount} de ${ids.length} acertaram</b><br/>${escapeHtml(q.exp)}</div>
          <label class="field-label field-gap">🏆 Top 5 no momento</label>
          <div class="leaderboard" id="lbSlot"></div>
          <div class="btn-row">
            <button class="btn btn-primary" id="nextBtn">${isLast ? 'Ver resultado final 🏁' : 'Próxima pergunta →'}</button>
          </div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    const barsSlot = wrap.querySelector('#barsSlot');
    q.opts.forEach((o,i)=>{
      const pct = Math.round((counts[i]/total)*100);
      barsSlot.appendChild(el(`
        <div class="bar-row">
          <div class="bar-label"><span>${OPT_ICON[i]} ${escapeHtml(o)}</span><span>${counts[i]}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colors[i]};"></div></div>
        </div>
      `));
    });
    const lbSlot = wrap.querySelector('#lbSlot');
    // Animação estilo Kahoot: aparecem um a um com delay escalonado + delta de pontos
    const prevScores = state._prevScores || {};
    sorted.forEach((p, i) => {
      const prev = prevScores[p.id];
      const pts = state.meta.qIndex > 0 && prev !== undefined
        ? p.score - prev : null;
      const deltaClass = pts === null ? '' : pts > 0 ? 'up' : pts < 0 ? 'down' : 'same';
      const deltaIcon = pts === null ? '' : pts > 0 ? '▲' : pts < 0 ? '▼' : '—';
      const deltaHTML = pts !== null
        ? `<span class="lb-delta ${deltaClass}">${deltaIcon} ${Math.abs(pts)}</span>` : '';
      const row = el(`
        <div class="lb-row lb-enter" style="animation-delay:${i*0.12}s">
          <div class="lb-rank" style="color:${i===0?'var(--safety)':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--ink-dim)'}">
            ${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}
          </div>
          <div class="lb-name">${avatarChipHTML(p.avatar)} ${escapeHtml(p.name)}${deltaHTML}</div>
          <div class="lb-score">${p.score} pts</div>
        </div>
      `);
      lbSlot.appendChild(row);
    });
    // Salvar scores para calcular delta na próxima rodada
    state._prevScores = {};
    sorted.forEach(p => { state._prevScores[p.id] = p.score; });
    wrap.querySelector('#nextBtn').addEventListener('click', hostNextOrEnd);
  }

  async function hostNextOrEnd(){
    if(state.meta.qIndex >= state.meta.total-1){
      state.meta.phase='end';
      await storeSet(`game:${state.pin}:meta`, state.meta);
      state.screen='host-end';
      render();
    } else {
      state.meta.qIndex += 1; state.meta.qStartTs = Date.now(); state.meta.phase='question';
      await storeSet(`game:${state.pin}:meta`, state.meta);
      state.screen='host-question';
      render();
    }
  }

  function hostRenderEnd(){
    app.innerHTML='';
    const ids = Object.keys(state.players);
    const sorted = ids.map(id=>state.players[id]).sort((x,y)=>y.score-x.score);
    const podium = sorted.slice(0,5);
    const rest = sorted.slice(5,10);
    const wrap = el(`
      <div class="wrap wide">
        <h1 class="brand">🏁 Fim de <span>Jogo</span></h1>
        <div class="card">
          <div class="podium" id="podiumSlot"></div>
          <label class="field-label field-gap">🏆 Classificação completa</label>
          <div class="leaderboard" id="restSlot"></div>
          <div class="btn-row">
            <button class="btn btn-primary" id="menuBtn">Voltar ao menu</button>
          </div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    confettiRain(80);
    fireworksShow(7);
    // Visual order left→right: 4th, 2nd, 1st, 3rd, 5th (classic "wave" podium shape)
    const order5 = [podium[3], podium[1], podium[0], podium[2], podium[4]];
    const posClass = ['pod-4','pod-2','pod-1','pod-3','pod-5'];
    const medals = ['','🥈','🥇','🥉',''];
    const jumpDelays = [0.3, 0.15, 0, 0.1, 0.35];
    const podSlot = wrap.querySelector('#podiumSlot');
    order5.forEach((p,i)=>{
      if(!p){ podSlot.appendChild(el(`<div class="pod-col ${posClass[i]}"><div class="pod-block"></div></div>`)); return; }
      podSlot.appendChild(el(`
        <div class="pod-col ${posClass[i]}">
          ${medals[i] ? `<div class="pod-medal">${medals[i]}</div>` : ''}
          <div class="pod-em">${avatarChipHTML(p.avatar, 'jump', jumpDelays[i])}</div>
          <div class="pod-block">${p.score}</div>
          <div class="pod-name">${escapeHtml(p.name)}</div>
        </div>
      `));
    });
    const restSlot = wrap.querySelector('#restSlot');
    rest.forEach((p,i)=>{ restSlot.appendChild(el(`<div class="lb-row"><div class="lb-rank">#${i+6}</div><div class="lb-name">${avatarChipHTML(p.avatar)} ${escapeHtml(p.name)}</div><div class="lb-score">${p.score} pts</div></div>`)); });
    wrap.querySelector('#menuBtn').addEventListener('click', ()=>{ state={screen:'menu'}; render(); });
  }

  // ================= PLAYER (join with PIN) =================
  function joinRenderForm(){
    app.innerHTML='';
    const wrap = el(`
      <div class="wrap">
        <h1 class="brand">🧑‍🎓 Entrar na <span>Sala</span></h1>
        <div class="tagline">Digite o PIN que o(a) professor(a) mostrou</div>
        <div class="card">
          <label class="field-label">PIN da sala</label>
          <input class="pinput" id="pinInput" maxlength="6" inputmode="numeric" placeholder="000000"/>
          <label class="field-label field-gap">Seu nome</label>
          <input class="nick" id="nameInput" maxlength="18" placeholder="Digite seu nome ou apelido" autocomplete="off"/>
          <label class="field-label field-gap">Monte seu personagem</label>
          <div id="customizerSlot"></div>
          <div id="errSlot"></div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="backBtn">← Menu</button>
            <button class="btn btn-primary" id="joinBtn" disabled>Entrar na sala ⚡</button>
          </div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    const getAvatarCfg = renderAvatarCustomizer(wrap.querySelector('#customizerSlot'));
    wrap.querySelector('#backBtn').addEventListener('click', ()=>{ state={screen:'menu'}; render(); });
    const pinInput = wrap.querySelector('#pinInput');
    pinInput.addEventListener('input', ()=>{ pinInput.value = pinInput.value.replace(/\D/g,'').slice(0,6); });
    const joinBtn = wrap.querySelector('#joinBtn');
    function checkReady(){ joinBtn.disabled = !(pinInput.value.length===6 && wrap.querySelector('#nameInput').value.trim()); }
    pinInput.addEventListener('input', checkReady);
    wrap.querySelector('#nameInput').addEventListener('input', checkReady);
    checkReady();

    joinBtn.addEventListener('click', async ()=>{
      joinBtn.disabled = true;
      const errSlot = wrap.querySelector('#errSlot'); errSlot.innerHTML='';
      const pin = pinInput.value;
      const meta = await storeGet(`game:${pin}:meta`);
      if(!meta){
        errSlot.appendChild(el(`<div class="feedback bad">Sala não encontrada. Confira o PIN com o(a) professor(a).</div>`));
        joinBtn.disabled=false; return;
      }
      if(meta.phase !== 'lobby'){
        errSlot.appendChild(el(`<div class="feedback bad">Essa sala já começou. Peça ao professor(a) uma nova sala ou aguarde a próxima.</div>`));
        joinBtn.disabled=false; return;
      }
      const id = genId();
      const name = wrap.querySelector('#nameInput').value.trim() || 'Eletricista';
      const doc = { id, name, avatar: getAvatarCfg(), score:0, streak:0, bestStreak:0, correctCount:0, answered:{} };
      const ok = await storeSet(`game:${pin}:player:${id}`, doc);
      if(!ok){
        errSlot.appendChild(el(`<div class="feedback bad">Não foi possível entrar agora. Tente novamente.</div>`));
        joinBtn.disabled=false; return;
      }
      state = { screen:'player-lobby', pin, meta, playerKey:`game:${pin}:player:${id}`, doc };
      render();
    });
  }

  function playerRenderLobby(){
    app.innerHTML='';
    const wrap = el(`
      <div class="wrap">
        <div class="card">
          <div class="waiting-pulse">
            <div class="em" style="animation:none;">${avatarChipHTML(state.doc.avatar, 'xl')}</div>
            <div class="result-title" style="margin-top:10px;">Você entrou, ${escapeHtml(state.doc.name)}!</div>
            <div class="loading-note">Aguardando o(a) professor(a) iniciar o jogo…</div>
          </div>
          <div class="hud-item" style="justify-content:center;">🔑 Sala <b>${state.pin}</b></div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    async function poll(){
      const meta = await storeGet(`game:${state.pin}:meta`);
      if(meta && meta.phase==='question'){
        state.meta = meta;
        state.screen='player-question';
        render();
      }
    }
    pollTimer = setInterval(poll, GAME_POLL);
  }

  function playerRenderQuestion(){
    app.innerHTML='';
    const qIndex = state.meta.qIndex;
    const q = QUESTIONS[state.meta.order[qIndex]];
    const wrap = el(`
      <div class="wrap">
        <div class="hud">
          <div class="hud-item">${avatarChipHTML(state.doc.avatar)} <b>${escapeHtml(state.doc.name)}</b></div>
          <div class="qcounter">Pergunta ${qIndex+1} / ${state.meta.total}</div>
          <div class="hud-item">🏆 <b>${state.doc.score}</b></div>
        </div>
        <div class="wire-track"><div class="wire-fill" id="wireFill" style="width:100%"></div><div class="wire-spark" id="wireSpark" style="left:100%"></div></div>
        <div class="card">
          <div class="question-box"><div class="qnum">⚡ PERGUNTA ${qIndex+1}</div><div class="qtext">${escapeHtml(q.q)}</div>${q.code ? `<pre class="code-block">${escapeHtml(q.code)}</pre>` : ''}</div>
          <div class="options-grid" id="optsGrid"></div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    const grid = wrap.querySelector('#optsGrid');
    q.opts.forEach((opt,i)=>{
      const b = el(`<button class="opt opt-${OPT_STYLE[i]}" data-i="${i}"><span class="opt-icon">${OPT_ICON[i]}</span><span>${escapeHtml(opt)}</span></button>`);
      b.addEventListener('click', ()=>playerAnswer(i, q));
      grid.appendChild(b);
    });
    const fill = wrap.querySelector('#wireFill'), spark = wrap.querySelector('#wireSpark');
    const startTs = state.meta.qStartTs, duration = state.meta.qDuration;
    let submitted = false;
    tickTimer = setInterval(()=>{
      const left = duration - (Date.now()-startTs);
      if(left<=0){
        updateWire(fill,spark,0,duration); clearInterval(tickTimer);
        if(!submitted){ submitted=true; playerAnswer(-1, q); }
        return;
      }
      updateWire(fill,spark,left,duration);
    }, 150);
    state._submitGuard = ()=>{ if(submitted) return true; submitted=true; return false; };
  }

  async function playerAnswer(choice, q){
    if(state._submitGuard && state._submitGuard()===true && choice!==-1){
      // already auto-submitted by timeout; ignore late click
      return;
    }
    clearInterval(tickTimer);
    const qIndex = state.meta.qIndex;
    const startTs = state.meta.qStartTs, duration = state.meta.qDuration;
    const timeLeftMs = Math.max(0, duration - (Date.now()-startTs));
    const isCorrect = choice === q.correct;
    let pts = 0;
    if(isCorrect){
      pts = 700 + Math.round((timeLeftMs/duration)*300) + Math.min(state.doc.streak,3)*10;
      state.doc.streak += 1; state.doc.bestStreak = Math.max(state.doc.bestStreak, state.doc.streak); state.doc.correctCount += 1;
    } else state.doc.streak = 0;
    state.doc.score += pts;
    state.doc.answered = state.doc.answered || {};
    state.doc.answered[qIndex] = { choice, correct:isCorrect, timeLeftMs };
    await storeSet(state.playerKey, state.doc);
    state._lastAnswer = { isCorrect, pts, choice, q };
    state.screen = 'player-waiting';
    render();
  }

  function playerRenderWaiting(){
    app.innerHTML='';
    const { isCorrect, pts, choice, q } = state._lastAnswer;
    const wrap = el(`
      <div class="wrap">
        <div class="card">
          <div class="waiting-pulse">
            <div class="em">${isCorrect ? '✅' : (choice===-1 ? '⏱️' : '❌')}</div>
            <div class="result-title" style="margin-top:6px;">${isCorrect ? 'Certo! +'+pts+' pts' : (choice===-1?'Tempo esgotado':'Não foi dessa vez')}</div>
          </div>
          <div class="feedback ${isCorrect?'ok':'bad'}">${escapeHtml(q.exp)}</div>
          <div class="stat-row">
            <div class="stat-box"><div class="num">${state.doc.score}</div><div class="lab">Pontos</div></div>
            <div class="stat-box"><div class="num">${state.doc.bestStreak}🔥</div><div class="lab">Sequência</div></div>
          </div>
          <div class="loading-note">Aguardando o(a) professor(a) avançar…</div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    async function poll(){
      const meta = await storeGet(`game:${state.pin}:meta`);
      if(!meta) return;
      if(meta.phase==='end'){ state.meta=meta; state.screen='player-end'; render(); return; }
      if(meta.phase==='question' && meta.qIndex !== state.meta.qIndex){
        state.meta = meta; state.screen='player-question'; render(); return;
      }
    }
    pollTimer = setInterval(poll, GAME_POLL);
  }

  function playerRenderEnd(){
    app.innerHTML='';
    const pct = Math.round((state.doc.correctCount/state.meta.total)*100);
    const r = ratingFor(pct);
    const wrap = el(`
      <div class="wrap">
        <div class="card">
          <div style="display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:6px;">
            <div class="avatar-chip lg">${buildAvatarSVG(state.doc.avatar)}</div>
            <div style="font-size:44px;line-height:1;">${r.emoji}</div>
          </div>
          <div class="result-title">${r.title}</div>
          <div class="result-sub">${escapeHtml(state.doc.name)} acertou ${state.doc.correctCount} de ${state.meta.total} perguntas (${pct}%)</div>
          <div class="stat-row">
            <div class="stat-box"><div class="num">${state.doc.score}</div><div class="lab">Pontos</div></div>
            <div class="stat-box"><div class="num">${state.doc.correctCount}</div><div class="lab">Acertos</div></div>
            <div class="stat-box"><div class="num">${state.doc.bestStreak}🔥</div><div class="lab">Sequência</div></div>
          </div>
          <label class="field-label">🏆 Classificação da sala</label>
          <div class="leaderboard" id="lbSlot"><div class="loading-note">Carregando classificação…</div></div>
          <div class="btn-row"><button class="btn btn-primary" id="menuBtn">Voltar ao menu</button></div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    wrap.querySelector('#menuBtn').addEventListener('click', ()=>{ state={screen:'menu'}; render(); });
    (async ()=>{
      const keys = await storeListKeys(`game:${state.pin}:player:`);
      const docs = [];
      for(const k of keys){ const d = await storeGet(k); if(d) docs.push(d); }
      docs.sort((a,b)=>b.score-a.score);
      const slot = wrap.querySelector('#lbSlot'); slot.innerHTML='';
      docs.slice(0,10).forEach((p,i)=>{
        const mine = p.id === state.doc.id;
        slot.appendChild(el(`<div class="lb-row ${mine?'lb-you':''}"><div class="lb-rank">#${i+1}</div><div class="lb-name">${avatarChipHTML(p.avatar)} ${escapeHtml(p.name)}</div><div class="lb-score">${p.score} pts</div></div>`));
      });
      if(docs.length && docs[0].id===state.doc.id){
        burstParticles(['🏆','⚡','✨']);
        confettiRain(60);
        const myChip = wrap.querySelector('.avatar-chip.lg');
        if(myChip){ myChip.classList.add('jump'); }
      }
    })();
  }

  // ---------------- Theme (light/dark) ----------------
  const themeBtn = document.createElement('button');
  themeBtn.className = 'theme-toggle';
  themeBtn.type = 'button';
  themeBtn.title = 'Alternar tema claro/escuro';
  document.body.appendChild(themeBtn);

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  }
  applyTheme('dark');
  themeBtn.addEventListener('click', ()=>{
    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    storeSetPersonal('theme-pref', {theme: next});
  });
  storeGetPersonal('theme-pref').then(pref=>{
    if(pref && (pref.theme==='light' || pref.theme==='dark')) applyTheme(pref.theme);
  });

  render();
})();
</script>
</body>
</html>
