<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡💻 ByteVolt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-panel:#10141c; --bg-panel2:#161c27; --line:#2a3242;
    --copper:#ff8a3d; --copper-dim:#c9622a; --safety:#ffcc33;
    --live:#3ecf8e; --danger:#ef4b5f; --ink:#eef1f6; --ink-dim:#93a0b4;
    --a:#3ea6ff; --b:#ff8a3d; --c:#3ecf8e; --d:#c88bff;
    --chip-bg:#0d1119; --glow-a:rgba(62,166,255,0.08); --glow-b:rgba(255,138,61,0.10); --accent-soft:#1a1608;
  }
  :root[data-theme="light"]{
    --bg-panel:#eef1f6; --bg-panel2:#ffffff; --line:#d8dee8;
    --copper:#d9661c; --copper-dim:#b8500f; --safety:#c98e00;
    --live:#1f9d67; --danger:#d63451; --ink:#14181f; --ink-dim:#5b6472;
    --a:#1c6fc9; --b:#d9661c; --c:#1f9d67; --d:#7a4cc0;
    --chip-bg:#eef1f5; --glow-a:rgba(28,111,201,0.06); --glow-b:rgba(217,102,28,0.07); --accent-soft:#fff3d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, var(--glow-a), transparent 40%),
      radial-gradient(circle at 85% 90%, var(--glow-b), transparent 45%),
      var(--bg-panel);
    background-attachment:fixed;
    font-family:'Manrope',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    transition:background-color .25s, color .25s;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
  .circuit-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35;}
  .wrap{position:relative;z-index:1;width:100%;max-width:820px;}
  .wrap.wide{max-width:960px;}

  h1.brand{font-family:'Archivo Black',sans-serif;font-size:clamp(28px,5vw,44px);letter-spacing:0.5px;text-align:center;margin:8px 0 4px;color:var(--ink);}
  h1.brand span{color:var(--safety);}
  .tagline{text-align:center;color:var(--ink-dim);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:28px;font-weight:700;}

  .card{background:linear-gradient(180deg, var(--bg-panel2), var(--bg-panel));border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 20px 40px -20px rgba(0,0,0,0.35);}

  .theme-toggle{position:fixed;top:16px;right:16px;z-index:200;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg-panel2);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,0.25);transition:transform .15s, border-color .15s;}
  .theme-toggle:hover{transform:scale(1.08);border-color:var(--copper-dim);}

  input.nick, input.pinput{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--chip-bg);color:var(--ink);font-size:16px;font-family:'Manrope';outline:none;transition:border-color .2s;}
  input.pinput{font-family:'Space Mono',monospace;letter-spacing:10px;text-align:center;font-size:26px;font-weight:700;}
  input.nick:focus, input.pinput:focus{border-color:var(--copper);}
  label.field-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-dim);font-weight:800;margin-bottom:8px;}
  .field-gap{margin-top:18px;}

  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px;}
  @media(max-width:560px){.avatar-grid{grid-template-columns:repeat(2,1fr);}}
  .avatar-card{background:var(--chip-bg);border:2px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;position:relative;}
  .avatar-card:hover{transform:translateY(-3px);border-color:var(--copper-dim);}
  .avatar-card.selected{border-color:var(--safety);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(255,204,51,0.15);}
  .avatar-emoji{font-size:34px;line-height:1;margin-bottom:8px;}
  .avatar-name{font-size:12px;font-weight:800;color:var(--ink);}
  .avatar-badge{position:absolute;top:6px;right:8px;font-size:14px;opacity:0.85;}

  /* Character customizer */
  .avatar-chip{display:inline-flex;width:40px;height:40px;flex-shrink:0;vertical-align:middle;}
  .avatar-chip svg{width:100%;height:100%;display:block;overflow:visible;}
  .avatar-chip.lg{width:96px;height:96px;}
  .avatar-chip.xl{width:150px;height:150px;}
  .avatar-svg .avatar-bob{animation:avatarBob 2.6s ease-in-out infinite;}
  @keyframes avatarBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .avatar-eyelid{animation:avatarBlink 4.4s ease-in-out infinite;}
  @keyframes avatarBlink{0%,90%,100%{opacity:0;}94%{opacity:1;}97%{opacity:0;}}
  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s, border-color .15s;}
  .swatch:hover{transform:scale(1.08);}
  .swatch.selected{border-color:var(--safety);box-shadow:0 0 0 3px rgba(255,204,51,0.18);}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .face-chip{background:var(--chip-bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:border-color .15s, transform .15s;color:var(--ink);}
  .face-chip:hover{transform:translateY(-2px);border-color:var(--copper-dim);}
  .face-chip.selected{border-color:var(--safety);background:var(--accent-soft);}

  /* Speech / thought bubbles */
  .speech-wrap{position:relative;display:inline-flex;}
  .speech-bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:12px;background:#f5f5f0;color:#14181f;padding:7px 12px;border-radius:14px;font-size:12px;font-weight:700;max-width:170px;min-width:60px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,0.35);z-index:5;line-height:1.35;font-family:'Manrope',sans-serif;}
  .speech-bubble.fala:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#f5f5f0;}
  .speech-bubble.pensamento{border-radius:50%/60%;}
  .speech-bubble.pensamento:after{content:'';position:absolute;top:100%;left:36%;width:11px;height:11px;border-radius:50%;background:#f5f5f0;}
  .speech-bubble.pensamento:before{content:'';position:absolute;top:calc(100% + 9px);left:28%;width:6px;height:6px;border-radius:50%;background:#f5f5f0;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:12px;border:none;cursor:pointer;font-family:'Manrope';font-weight:800;font-size:15px;letter-spacing:0.3px;transition:transform .12s, filter .12s;user-select:none;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{background:var(--safety);color:#1a1608;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:2px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--copper-dim);}
  .btn-block{width:100%;}
  .btn-row{display:flex;justify-content:center;margin-top:24px;gap:12px;flex-wrap:wrap;}

  .menu-options{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .menu-opt{display:flex;align-items:center;gap:16px;background:var(--chip-bg);border:2px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;transition:border-color .15s, transform .15s;text-align:left;}
  .menu-opt:hover{border-color:var(--copper-dim);transform:translateY(-2px);}
  .menu-opt .ic{font-size:28px;}
  .menu-opt .tt{font-weight:800;font-size:15.5px;color:var(--ink);}
  .menu-opt .ds{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}

  .hud{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:16px;font-family:'Space Mono',monospace;}
  .hud-item{background:var(--chip-bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
  .hud-item b{color:var(--safety);font-size:15px;}
  .qcounter{font-family:'Space Mono',monospace;color:var(--ink-dim);font-size:13px;}

  .wire-track{position:relative;width:100%;height:14px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--line);overflow:hidden;margin-bottom:22px;}
  .wire-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg, var(--live), var(--safety));border-radius:10px;transition:width 0.25s linear, background 0.4s linear;}
  .wire-spark{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,0.9);transform:translate(-50%,-50%);transition:left 0.25s linear;}

  .question-box{text-align:center;padding:6px 4px 22px;}
  .code-block{
    text-align:left;background:var(--chip-bg);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin:16px auto 4px;max-width:520px;overflow-x:auto;
    font-family:'Space Mono',monospace;font-size:14px;line-height:1.6;color:var(--live);
    white-space:pre;
  }
  .qnum{font-family:'Space Mono',monospace;color:var(--copper);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-weight:700;}
  .qtext{font-family:'Archivo Black',sans-serif;font-size:clamp(19px,3.2vw,26px);line-height:1.35;color:var(--ink);}

  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  @media(max-width:560px){.options-grid{grid-template-columns:1fr;}}
  .opt{display:flex;align-items:center;gap:12px;padding:18px 16px;border-radius:14px;border:none;cursor:pointer;font-family:'Manrope';font-weight:700;font-size:15.5px;text-align:left;color:#14181f;transition:transform .1s, filter .1s, opacity .2s;}
  .opt:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-2px);}
  .opt:disabled{cursor:default;}
  .opt-icon{font-size:20px;flex-shrink:0;}
  .opt-a{background:var(--a);} .opt-b{background:var(--b);} .opt-c{background:var(--c);} .opt-d{background:var(--d);}
  .opt.correct{outline:4px solid var(--live);box-shadow:0 0 24px rgba(62,207,142,0.55);}
  .opt.wrong{outline:4px solid var(--danger);box-shadow:0 0 24px rgba(239,75,95,0.5);opacity:0.75;}
  .opt.dim{opacity:0.35;}

  .feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:14px;background:var(--chip-bg);border:1px solid var(--line);color:var(--ink-dim);text-align:left;line-height:1.5;}
  .feedback b{color:var(--ink);}
  .feedback.ok{border-color:rgba(62,207,142,0.4);}
  .feedback.bad{border-color:rgba(239,75,95,0.4);}

  .streak-pop{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--safety);color:#1a1608;font-weight:800;font-family:'Space Mono',monospace;padding:8px 18px;border-radius:30px;font-size:14px;z-index:50;animation:popIn .35s ease, popOut .3s ease 1.4s forwards;box-shadow:0 8px 20px rgba(0,0,0,0.4);}
  @keyframes popIn{from{opacity:0;transform:translate(-50%,-10px) scale(0.8);}to{opacity:1;transform:translate(-50%,0) scale(1);}}
  @keyframes popOut{to{opacity:0;transform:translate(-50%,-10px) scale(0.8);}}
  .particles{position:fixed;inset:0;pointer-events:none;z-index:40;}
  .particle{position:absolute;font-size:22px;animation:rise 1s ease-out forwards;}
  @keyframes rise{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(-140px) rotate(30deg);}}
  .shake{animation:shakeAnim .4s;}
  @keyframes shakeAnim{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-8px);}40%,60%{transform:translateX(8px);}}

  /* Podium celebration: confetti rain */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden;}
  .confetti-piece{position:absolute;top:-24px;opacity:0.95;animation:confettiFall linear forwards;border-radius:2px;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(112vh) rotate(760deg);opacity:0.85;}
  }
  /* Podium celebration: firework bursts */
  .firework{position:fixed;pointer-events:none;z-index:71;width:0;height:0;}
  .spark{position:absolute;top:0;left:0;width:7px;height:7px;border-radius:50%;animation:sparkFly 0.9s ease-out forwards;}
  @keyframes sparkFly{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(0.25);opacity:0;}
  }
  /* Podium celebration: jumping avatars */
  @keyframes avatarJump{
    0%,100%{transform:translateY(0) scale(1,1);}
    28%{transform:translateY(-16px) scale(1.06,0.94);}
    52%{transform:translateY(0) scale(0.94,1.06);}
    75%{transform:translateY(-7px) scale(1.02,0.98);}
  }
  .avatar-chip.jump .avatar-bob{animation:avatarJump 0.75s ease-in-out infinite; animation-delay:var(--jd,0s);}

  .result-emoji{font-size:64px;text-align:center;margin-bottom:6px;}
  .result-title{font-family:'Archivo Black';font-size:24px;text-align:center;color:var(--safety);}
  .result-sub{text-align:center;color:var(--ink-dim);margin-top:4px;font-size:14px;}
  .stat-row{display:flex;justify-content:center;gap:14px;margin:22px 0;flex-wrap:wrap;}
  .stat-box{background:var(--chip-bg);border:1px solid var(--line);border-radius:14px;padding:14px 20px;text-align:center;min-width:100px;}
  .stat-box .num{font-family:'Space Mono';font-size:22px;color:var(--copper);font-weight:700;}
  .stat-box .lab{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

  .leaderboard{margin-top:8px;}
  .lb-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--line);margin-bottom:8px;font-family:'Space Mono',monospace;font-size:13.5px;}
  .lb-rank{width:26px;color:var(--ink-dim);font-weight:700;}
  .lb-name{flex:1;color:var(--ink);font-weight:700;font-family:'Manrope';display:flex;align-items:center;gap:8px;}
  .lb-score{color:var(--safety);font-weight:700;}
  .lb-you{border-color:var(--safety);background:var(--accent-soft);}

  .footnote{text-align:center;color:var(--ink-dim);font-size:11.5px;margin-top:18px;line-height:1.5;}
  .loading-note{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:14px;}

  /* PIN display */
  .pin-box{text-align:center;padding:18px 0 6px;}
  .pin-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--ink-dim);font-weight:800;margin-bottom:10px;}
  .pin-value{font-family:'Space Mono',monospace;font-size:clamp(44px,10vw,72px);font-weight:700;letter-spacing:10px;color:var(--safety);text-shadow:0 0 30px rgba(255,204,51,0.35);}
  .pin-hint{color:var(--ink-dim);font-size:13px;margin-top:6px;}

  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:18px;}
  .roster-card{background:var(--chip-bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;animation:popIn .3s ease;}
  .roster-emoji{font-size:24px;}
  .roster-name{font-size:11px;font-weight:700;margin-top:4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .roster-count{text-align:center;font-family:'Space Mono';color:var(--copper);font-weight:700;margin-top:14px;font-size:14px;}

  .bar-row{margin-bottom:12px;}
  .bar-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:5px;}
  .bar-track{height:22px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--line);overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;transition:width .5s ease;}

  .waiting-pulse{text-align:center;padding:30px 0;}
  .waiting-pulse .em{font-size:48px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.12);opacity:0.7;}}

  .podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:26px 0 10px;flex-wrap:nowrap;}
  .pod-col{text-align:center;}
  .pod-block{background:linear-gradient(180deg,#1c2432,#0d1119);border:1px solid var(--line);border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:'Space Mono';font-weight:700;color:var(--safety);}
  .pod-1 .pod-block{height:120px;width:88px;border-color:var(--safety);}
  .pod-2 .pod-block{height:88px;width:78px;border-color:#c9c9c9;}
  .pod-3 .pod-block{height:64px;width:78px;border-color:#d9661c;}
  .pod-4 .pod-block{height:44px;width:64px;}
  .pod-5 .pod-block{height:34px;width:64px;}
  .pod-medal{font-size:18px;margin-bottom:2px;}
  .pod-name{font-size:11.5px;font-weight:800;margin-top:8px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pod-em{font-size:26px;}
  @media(max-width:560px){
    .podium{gap:5px;}
    .pod-1 .pod-block{width:64px;} .pod-2 .pod-block{width:56px;} .pod-3 .pod-block{width:56px;}
    .pod-4 .pod-block{width:46px;} .pod-5 .pod-block{width:46px;}
    .pod-name{font-size:9.5px;max-width:60px;}
    .pod-em .avatar-chip{width:32px;height:32px;}
  }
</style>
</head>
<body>
<svg class="circuit-bg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <g stroke="#3ea6ff" stroke-width="2" fill="none" opacity="0.5">
    <path d="M0 120 H180 V260 H420"/>
    <path d="M800 60 H600 V220 H380"/>
    <path d="M0 700 H220 V560 H500"/>
    <path d="M800 760 H560 V600 H320"/>
  </g>
  <g fill="#ff8a3d" opacity="0.6">
    <circle cx="180" cy="120" r="5"/><circle cx="420" cy="260" r="5"/>
    <circle cx="600" cy="60" r="5"/><circle cx="380" cy="220" r="5"/>
    <circle cx="220" cy="700" r="5"/><circle cx="500" cy="560" r="5"/>
    <circle cx="560" cy="760" r="5"/><circle cx="320" cy="600" r="5"/>
  </g>
</svg>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------------- Data ----------------
  const CREATURES = [
    {id:'voltz', name:'Voltz', color:'#ffcc33'},
    {id:'bitinho', name:'Bitinho', color:'#20242c'},
    {id:'pilhax', name:'Pilhax', color:'#ffcc33'},
    {id:'resistorzinho', name:'Resistorzinho', color:'#e8d9c4'},
    {id:'waifi', name:'Wai-Fi', color:'#3ea6ff'},
    {id:'magnetojr', name:'Magneto Jr.', color:'#c9c9c9'},
    {id:'bytezao', name:'Bytezão', color:'#3ecf8e'},
    {id:'firewall', name:'Firewall', color:'#ef4b5f'},
    {id:'plugao', name:'Plugão', color:'#3a4254'},
    {id:'antena', name:'Antena', color:'#8a5fd1'},
    {id:'codezin', name:'Codezin', color:'#2a3242'},
    {id:'pixelon', name:'Pixelon', color:'#8a5fd1'},
    {id:'cabinho', name:'Cabinho', color:'#20242c'},
    {id:'ledinho', name:'Ledinho', color:'#3ecf8e'},
    {id:'nuvem', name:'Nuvem', color:'#eaf4ff'},
    {id:'chipzera', name:'Chipzera', color:'#20242c'},
    {id:'mouseinho', name:'Mouseinho', color:'#c88bff'},
    {id:'tecladinho', name:'Tecladinho', color:'#3a4254'},
  ];

  const ACCESSORIES = [
    {id:'nenhum', label:'Nenhum', hint:'🚫'},
    {id:'chapeu', label:'Chapéu', hint:'🎩'},
    {id:'oculos', label:'Óculos', hint:'🕶️'},
    {id:'laco', label:'Laço', hint:'🎀'},
    {id:'coroa', label:'Coroa', hint:'👑'},
    {id:'bandana', label:'Bandana', hint:'🧣'},
    {id:'capacete', label:'Capacete', hint:'⛑️'},
    {id:'formatura', label:'Formatura', hint:'🎓'},
    {id:'fone', label:'Fone de ouvido', hint:'🎧'},
    {id:'gravata', label:'Gravata', hint:'👔'},
    {id:'cachecol', label:'Cachecol', hint:'🎗️'},

  // Wraps an avatar chip with its speech/thought bubble (if the player set one).
  function avatarBubbleHTML(cfg, size){
    const chip = avatarChipHTML(cfg, size);
    const bubble = cfg && typeof cfg === 'object' ? cfg.bubble : null;
    if(!bubble || bubble.type==='nenhum' || !bubble.text || !bubble.text.trim()){
      return `<span class="speech-wrap">${chip}</span>`;
    }
    const cls = bubble.type==='pensamento' ? 'pensamento' : 'fala';
    return `<span class="speech-wrap"><span class="speech-bubble ${cls}">${escapeHtml(bubble.text)}</span>${chip}</span>`;
  }

  // Renders the creature picker (live SVG preview + species grid + accessory + bubble) into `container`.
  // Returns getCfg() -> current avatar config object.
  function renderAvatarCustomizer(container, initialCfg){
    let cfg = Object.assign({}, defaultAvatarCfg(), initialCfg||{});
    cfg.bubble = Object.assign({type:'nenhum', text:''}, cfg.bubble||{});
    const box = el(`
      <div>
        <div style="display:flex;justify-content:center;margin:4px 0 18px;" id="avPreviewSlot"></div>
        <label class="field-label">Escolha sua criatura</label>
        <div class="avatar-grid" id="creatureGrid" style="grid-template-columns:repeat(3,1fr);"></div>
        <label class="field-label field-gap">Acessório</label>
        <div class="chip-row" id="accessoryRow"></div>
        <label class="field-label field-gap">Balão de fala ou pensamento</label>
        <div class="chip-row" id="bubbleTypeRow"></div>
        <input class="nick field-gap" id="bubbleTextInput" maxlength="40" placeholder="Escreva uma frase (opcional)"/>
        <div class="btn-row" style="margin-top:6px;">
          <button type="button" class="btn btn-ghost" id="randomBtn">🎲 Sortear criatura</button>
        </div>
      </div>
    `);
    container.appendChild(box);
    const previewSlot = box.querySelector('#avPreviewSlot');
    function repaint(){ previewSlot.innerHTML = avatarBubbleHTML(cfg, 'xl'); }

    function paintCreatureGrid(rowEl){
      rowEl.innerHTML='';
      CREATURES.forEach(cr=>{
        const card = el(`
          <div class="avatar-card ${cfg.creature===cr.id?'selected':''}" data-creature="${cr.id}" style="padding:10px 6px;">
            <div class="avatar-chip" style="margin:0 auto 6px;">${buildAvatarSVG({creature:cr.id, accessory:'nenhum'})}</div>
            <div class="avatar-name">${cr.name}</div>
          </div>
        `);
        card.addEventListener('click', ()=>{ cfg.creature=cr.id; paintCreatureGrid(rowEl); repaint(); });
        rowEl.appendChild(card);
      });
    }
    function paintChips(rowEl, list, key){
      rowEl.innerHTML='';
      list.forEach(item=>{
        const chip = el(`<div class="face-chip ${cfg[key]===item.id?'selected':''}">${item.hint} ${item.label}</div>`);
        chip.addEventListener('click', ()=>{ cfg[key]=item.id; paintChips(rowEl,list,key); repaint(); });
        rowEl.appendChild(chip);
      });
    }
    function paintBubbleTypes(rowEl){
      rowEl.innerHTML='';
      BUBBLE_TYPES.forEach(item=>{
        const chip = el(`<div class="face-chip ${cfg.bubble.type===item.id?'selected':''}">${item.hint} ${item.label}</div>`);
        chip.addEventListener('click', ()=>{ cfg.bubble.type=item.id; paintBubbleTypes(rowEl); repaint(); });
        rowEl.appendChild(chip);
      });
    }

    const creatureGrid=box.querySelector('#creatureGrid'), accessoryRow=box.querySelector('#accessoryRow'), bubbleTypeRow=box.querySelector('#bubbleTypeRow');
    const bubbleTextInput = box.querySelector('#bubbleTextInput');
    paintCreatureGrid(creatureGrid);
    paintChips(accessoryRow, ACCESSORIES, 'accessory');
    paintBubbleTypes(bubbleTypeRow);
    bubbleTextInput.value = cfg.bubble.text || '';
    bubbleTextInput.addEventListener('input', ()=>{ cfg.bubble.text = bubbleTextInput.value; repaint(); });
    repaint();

    box.querySelector('#randomBtn').addEventListener('click', ()=>{
      const keepBubble = cfg.bubble;
      cfg = randomAvatarCfg();
      cfg.bubble = keepBubble;
      paintCreatureGrid(creatureGrid);
      paintChips(accessoryRow, ACCESSORIES, 'accessory');
      repaint();
    });

    return function getCfg(){ return Object.assign({}, cfg, {bubble: Object.assign({}, cfg.bubble)}); };
  }

  function poolForCategories(cats, diffs){
    // cats: array of category ids selected. diffs: array of difficulty ids selected ('padrao'|'avancado'|'expert').
    diffs = diffs || ['padrao','avancado','expert'];
    const idx = [];
    QUESTIONS.forEach((q,i)=>{
      if(!cats.includes(q.cat)) return;
      const qd = q.diff || 'padrao';
      if(!diffs.includes(qd)) return;
      idx.push(i);
    });
    return idx;
  }
  function countChoicesFor(poolLen){
    const base = [5,10,15,20];
    let opts = base.filter(n=>n<poolLen);
    opts.push(poolLen);
    return [...new Set(opts)].sort((a,b)=>a-b);
  }

  // Renders category checkboxes + difficulty checkboxes + question-count select + time select into `container`.
  // Returns a getConfig() function -> {cats:[...], diffs:[...], count:Number, time:Number(seconds)} or null if invalid.
  function buildConfigUI(container, defaults){
    defaults = defaults || {};
    const selectedAreas = new Set(defaults.areas || AREAS.map(a=>a.id));
    const selectedCats = new Set(defaults.cats || CATEGORIES.map(c=>c.id));
    const selectedDiffs = new Set(defaults.diffs || ['padrao','avancado']);
    const box = el(`
      <div>
        <label class="field-label field-gap">Área</label>
        <div class="avatar-grid" id="areaGrid" style="grid-template-columns:repeat(2,1fr);"></div>
        <label class="field-label field-gap">Categorias</label>
        <div class="avatar-grid" id="catGrid" style="grid-template-columns:repeat(2,1fr);"></div>
        <label class="field-label field-gap">Nível de dificuldade</label>
        <div class="avatar-grid" id="diffGrid" style="grid-template-columns:repeat(3,1fr);"></div>
        <label class="field-label field-gap">Quantidade de perguntas</label>
        <select class="nick" id="countSelect"></select>
        <label class="field-label field-gap">Tempo por pergunta</label>
        <select class="nick" id="timeSelect">
          ${TIME_CHOICES.map(t=>`<option value="${t}" ${t===(defaults.time||ROOM_TIME_DEFAULT)?'selected':''}>${t} segundos</option>`).join('')}
        </select>
        <div id="catWarn"></div>
      </div>
    `);
    container.appendChild(box);
    const areaGrid = box.querySelector('#areaGrid');
    const catGrid = box.querySelector('#catGrid');
    const diffGrid = box.querySelector('#diffGrid');
    const countSelect = box.querySelector('#countSelect');
    const catWarn = box.querySelector('#catWarn');

    function refreshCountOptions(){
      const pool = poolForCategories([...selectedCats], [...selectedDiffs]);
      countSelect.innerHTML='';
      if(pool.length===0){
        catWarn.innerHTML = '<div class="feedback bad">Nenhuma pergunta encontrada para essa combinação de área, categoria e dificuldade. Tente ajustar as opções.</div>';
        return;
      }
      catWarn.innerHTML='';
      const choices = countChoicesFor(pool.length);
      choices.forEach(n=>{
        const label = n===pool.length ? `Todas (${n})` : `${n} perguntas`;
        const opt = document.createElement('option');
        opt.value = n; opt.textContent = label;
        if(defaults.count && defaults.count===n) opt.selected = true;
        countSelect.appendChild(opt);
      });
      if(!defaults.count) countSelect.value = choices[choices.length-1];
    }

    function refreshCategoryGrid(){
      // Keep only categories that belong to a currently selected area.
      [...selectedCats].forEach(id=>{
        const cat = CATEGORIES.find(c=>c.id===id);
        if(cat && !selectedAreas.has(cat.area)) selectedCats.delete(id);
      });
      catGrid.innerHTML='';
      CATEGORIES.filter(c=>selectedAreas.has(c.area)).forEach(c=>{
        const total = QUESTIONS.filter(q=>q.cat===c.id).length;
        const card = el(`
          <div class="avatar-card ${selectedCats.has(c.id)?'selected':''}" data-cat="${c.id}" style="padding:12px 8px;">
            <div class="avatar-emoji" style="font-size:24px;">${c.emoji}</div>
            <div class="avatar-name">${c.label}</div>
            <div class="loading-note" style="margin-top:2px;">${total} perg.</div>
          </div>
        `);
        card.addEventListener('click', ()=>{
          if(selectedCats.has(c.id)) selectedCats.delete(c.id); else selectedCats.add(c.id);
          card.classList.toggle('selected');
          refreshCountOptions();
        });
        catGrid.appendChild(card);
      });
      refreshCountOptions();
    }

    AREAS.forEach(a=>{
      const total = QUESTIONS.filter(q=>{ const cat = CATEGORIES.find(c=>c.id===q.cat); return cat && cat.area===a.id; }).length;
      const card = el(`
        <div class="avatar-card ${selectedAreas.has(a.id)?'selected':''}" data-area="${a.id}" style="padding:14px 8px;">
          <div class="avatar-emoji" style="font-size:26px;">${a.emoji}</div>
          <div class="avatar-name">${a.label}</div>
          <div class="loading-note" style="margin-top:2px;">${total} perg.</div>
        </div>
      `);
      card.addEventListener('click', ()=>{
        if(selectedAreas.has(a.id)){
          if(selectedAreas.size===1) return; // keep at least one area selected
          selectedAreas.delete(a.id);
        } else selectedAreas.add(a.id);
        card.classList.toggle('selected');
        refreshCategoryGrid();
      });
      areaGrid.appendChild(card);
    });

    DIFFICULTIES.forEach(d=>{
      const total = QUESTIONS.filter(q=>(q.diff||'padrao')===d.id).length;
      const card = el(`
        <div class="avatar-card ${selectedDiffs.has(d.id)?'selected':''}" data-diff="${d.id}" style="padding:12px 6px;">
          <div class="avatar-emoji" style="font-size:22px;">${d.emoji}</div>
          <div class="avatar-name">${d.label}</div>
          <div class="loading-note" style="margin-top:2px;">${total} perg.</div>
        </div>
      `);
      card.addEventListener('click', ()=>{
        if(selectedDiffs.has(d.id)) selectedDiffs.delete(d.id); else selectedDiffs.add(d.id);
        card.classList.toggle('selected');
        refreshCountOptions();
      });
      diffGrid.appendChild(card);
    });

    refreshCategoryGrid();

    return function getConfig(){
      const cats = [...selectedCats];
      const diffs = [...selectedDiffs];
      const areas = [...selectedAreas];
      const pool = poolForCategories(cats, diffs);
      if(pool.length===0) return null;
      return { areas, cats, diffs, count: Number(countSelect.value), time: Number(box.querySelector('#timeSelect').value) };
    };
  }

  function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function shuffledIndices(n){ const arr=Array.from({length:n},(_,i)=>i); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  const HAS_ARTIFACT_STORAGE = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';

  function initFirebase(){

  // "game:123456:player:abc" -> "game/123456/player/abc" (Realtime Database uses path segments)
  function keyToPath(key){ return key.split(':').filter(Boolean).join('/'); }

  async function storeGet(key){
    if(HAS_ARTIFACT_STORAGE){
      try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    if(!initFirebase()) return null;
    try{ const snap = await fbDb.ref(keyToPath(key)).once('value'); return snap.exists() ? snap.val() : null; }
    catch(e){ return null; }
  }
  async function storeSet(key, obj){
    if(HAS_ARTIFACT_STORAGE){
      try{ await window.storage.set(key, JSON.stringify(obj), true); return true; }
      catch(e){ return false; }
    }
    if(!initFirebase()) return false;
    try{ await fbDb.ref(keyToPath(key)).set(obj); return true; }
    catch(e){ return false; }
  }
  async function storeListKeys(prefix){
    if(HAS_ARTIFACT_STORAGE){
      try{ const r = await window.storage.list(prefix, true); return (r && r.keys) ? r.keys : []; }
      catch(e){ return []; }
    }
    if(!initFirebase()) return [];
    try{
      const cleanPrefix = prefix.endsWith(':') ? prefix.slice(0,-1) : prefix;
      const snap = await fbDb.ref(keyToPath(cleanPrefix)).once('value');
      if(!snap.exists()) return [];
      const val = snap.val();
      const basePrefix = prefix.endsWith(':') ? prefix : prefix+':';
      return Object.keys(val).map(childId => basePrefix + childId);
    }catch(e){ return []; }
  }
  // Personal (non-shared) variants — used for things like the theme preference, which is per-device, not per-room.
  // On your own site these use localStorage (a real browser, not an artifact sandbox, so it's safe here).
  async function storeGetPersonal(key){
    if(HAS_ARTIFACT_STORAGE){
      try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    try{ const raw = localStorage.getItem('bytevolt:'+key); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  async function storeSetPersonal(key, obj){
    if(HAS_ARTIFACT_STORAGE){
      try{ await window.storage.set(key, JSON.stringify(obj), false); return true; }
      catch(e){ return false; }
    }
    try{ localStorage.setItem('bytevolt:'+key, JSON.stringify(obj)); return true; }
    catch(e){ return false; }
  }

  function updateWire(fill, spark, t, duration){
    duration = duration || ROOM_TIME_DEFAULT;
    const pct = Math.max(0,(t/duration)*100);
    fill.style.width = pct+'%'; spark.style.left = pct+'%';
    if(pct<33) fill.style.background='linear-gradient(90deg,#ef4b5f,#ff8a3d)';
    else if(pct<66) fill.style.background='linear-gradient(90deg,#ffcc33,#ff8a3d)';
    else fill.style.background='linear-gradient(90deg,#3ecf8e,#ffcc33)';
  }

  function soloHandleAnswer(choice, wrap, q){
    if(state.answered) return;
    state.answered=true; clearInterval(tickTimer);
    const isCorrect = choice===q.correct;
    const timeLeft = state.timeLeft;
    let pts=0;
    if(isCorrect){
      pts = 500 + Math.round((timeLeft/state.timePerQ)*500) + Math.min(state.streak,5)*20;
      state.streak+=1; state.best_streak=Math.max(state.best_streak,state.streak); state.correctCount+=1;
    } else state.streak=0;
    state.score += pts;
    const buttons = wrap.querySelectorAll('.opt');
    buttons.forEach((b,i)=>{ b.disabled=true; if(i===q.correct) b.classList.add('correct'); else if(i===choice) b.classList.add('wrong'); else b.classList.add('dim'); });
    const scoreVal = wrap.querySelector('#scoreVal'); if(scoreVal) scoreVal.textContent=state.score;
    const slot = wrap.querySelector('#feedbackSlot');
    const fb = el(`<div class="feedback ${isCorrect?'ok':'bad'}"><b>${isCorrect?'✅ Certo! +'+pts+' pts':(choice===-1?'⏱️ Tempo esgotado!':'❌ Não foi dessa vez.')}</b><br/>${escapeHtml(q.exp)}</div>`);
    slot.appendChild(fb);
    if(isCorrect && state.streak>=3) showStreakPop(state.streak);
    if(isCorrect) burstParticles(['✨','🎉','⭐']); else wrap.querySelector('.card').classList.add('shake');
    const nextWrap = el(`<div class="btn-row"></div>`);
    const isLast = state.qIndex >= state.totalQ-1;
    const nextBtn = el(`<button class="btn btn-primary">${isLast?'Ver resultado 🏁':'Próxima pergunta →'}</button>`);
    nextBtn.addEventListener('click', ()=>{ if(isLast){ soloFinish(); } else { state.qIndex+=1; render(); } });
    nextWrap.appendChild(nextBtn); slot.appendChild(nextWrap);
  }

  function showStreakPop(streak){ const pop=el(`<div class="streak-pop">🔥 Sequência de ${streak}!</div>`); document.body.appendChild(pop); setTimeout(()=>pop.remove(),1700); }
  function burstParticles(emojis){
    const layer=document.createElement('div'); layer.className='particles'; document.body.appendChild(layer);
    for(let i=0;i<10;i++){ const p=document.createElement('div'); p.className='particle'; p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left=(45+Math.random()*10)+'vw'; p.style.top=(55+Math.random()*10)+'vh'; p.style.fontSize=(16+Math.random()*16)+'px'; layer.appendChild(p); }
    setTimeout(()=>layer.remove(),1100);
  }

  const CONFETTI_COLORS = ['#ffcc33','#3ecf8e','#ef4b5f','#3ea6ff','#ff8a3d','#c88bff'];

  function confettiRain(count){
    count = count || 70;
    const layer = document.createElement('div');
    layer.className = 'confetti-layer';
    document.body.appendChild(layer);
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (Math.random()*100)+'vw';
      p.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
      p.style.width = (5+Math.random()*6)+'px';
      p.style.height = (10+Math.random()*9)+'px';
      p.style.animationDuration = (2.2+Math.random()*2.4).toFixed(2)+'s';
      p.style.animationDelay = (Math.random()*1.1).toFixed(2)+'s';
      layer.appendChild(p);
    }
    setTimeout(()=>layer.remove(), 5600);
  }

  function fireworkBurst(x, y){
    const holder = document.createElement('div');
    holder.className = 'firework';
    holder.style.left = x+'px'; holder.style.top = y+'px';
    document.body.appendChild(holder);
    const n = 12;
    for(let i=0;i<n;i++){
      const angle = (i/n)*2*Math.PI + Math.random()*0.3;
      const dist = 36+Math.random()*34;
      const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
      s.style.setProperty('--dx', dx+'px');
      s.style.setProperty('--dy', dy+'px');
      holder.appendChild(s);
    }
    setTimeout(()=>holder.remove(), 950);
  }

  function fireworksShow(rounds){

      }, i*420 + Math.random()*220);
    }
  }

          </div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    confettiRain(80);
    fireworksShow(7);
    // Visual order left→right: 4th, 2nd, 1st, 3rd, 5th (classic "wave" podium shape)
    const order5 = [podium[3], podium[1], podium[0], podium[2], podium[4]];
    const posClass = ['pod-4','pod-2','pod-1','pod-3','pod-5'];
    const medals = ['','🥈','🥇','🥉',''];
    const jumpDelays = [0.3, 0.15, 0, 0.1, 0.35];
    const podSlot = wrap.querySelector('#podiumSlot');
    order5.forEach((p,i)=>{
      if(!p){ podSlot.appendChild(el(`<div class="pod-col ${posClass[i]}"><div class="pod-block"></div></div>`)); return; }
      podSlot.appendChild(el(`
        <div class="pod-col ${posClass[i]}">
          ${medals[i] ? `<div class="pod-medal">${medals[i]}</div>` : ''}
          <div class="pod-em">${avatarChipHTML(p.avatar, 'jump', jumpDelays[i])}</div>
          <div class="pod-block">${p.score}</div>
          <div class="pod-name">${escapeHtml(p.name)}</div>
        </div>
      `));
    });
    const restSlot = wrap.querySelector('#restSlot');
    rest.forEach((p,i)=>{ restSlot.appendChild(el(`<div class="lb-row"><div class="lb-rank">#${i+6}</div><div class="lb-name">${avatarChipHTML(p.avatar)} ${escapeHtml(p.name)}</div><div class="lb-score">${p.score} pts</div></div>`)); });
    wrap.querySelector('#menuBtn').addEventListener('click', ()=>{ state={screen:'menu'}; render(); });
  }

  // ================= PLAYER (join with PIN) =================
  function joinRenderForm(){
    app.innerHTML='';
    const wrap = el(`
      <div class="wrap">
        <h1 class="brand">🧑‍🎓 Entrar na <span>Sala</span></h1>
        <div class="tagline">Digite o PIN que o(a) professor(a) mostrou</div>
        <div class="card">
          <label class="field-label">PIN da sala</label>
          <input class="pinput" id="pinInput" maxlength="6" inputmode="numeric" placeholder="000000"/>
          <label class="field-label field-gap">Seu nome</label>
          <input class="nick" id="nameInput" maxlength="18" placeholder="Digite seu nome ou apelido" autocomplete="off"/>
          <label class="field-label field-gap">Monte seu personagem</label>
          <div id="customizerSlot"></div>
          <div id="errSlot"></div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="backBtn">← Menu</button>
            <button class="btn btn-primary" id="joinBtn" disabled>Entrar na sala ⚡</button>
          </div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    const getAvatarCfg = renderAvatarCustomizer(wrap.querySelector('#customizerSlot'));
    wrap.querySelector('#backBtn').addEventListener('click', ()=>{ state={screen:'menu'}; render(); });
    const pinInput = wrap.querySelector('#pinInput');
    pinInput.addEventListener('input', ()=>{ pinInput.value = pinInput.value.replace(/\D/g,'').slice(0,6); });
    const joinBtn = wrap.querySelector('#joinBtn');
    function checkReady(){ joinBtn.disabled = !(pinInput.value.length===6 && wrap.querySelector('#nameInput').value.trim()); }
    pinInput.addEventListener('input', checkReady);
    wrap.querySelector('#nameInput').addEventListener('input', checkReady);
    checkReady();

    joinBtn.addEventListener('click', async ()=>{
      joinBtn.disabled = true;
      const errSlot = wrap.querySelector('#errSlot'); errSlot.innerHTML='';
      const pin = pinInput.value;
      const meta = await storeGet(`game:${pin}:meta`);
      if(!meta){
        errSlot.appendChild(el(`<div class="feedback bad">Sala não encontrada. Confira o PIN com o(a) professor(a).</div>`));
        joinBtn.disabled=false; return;
      }
      if(meta.phase !== 'lobby'){
        errSlot.appendChild(el(`<div class="feedback bad">Essa sala já começou. Peça ao professor(a) uma nova sala ou aguarde a próxima.</div>`));
        joinBtn.disabled=false; return;
      }
      const id = genId();
      const name = wrap.querySelector('#nameInput').value.trim() || 'Eletricista';
      const doc = { id, name, avatar: getAvatarCfg(), score:0, streak:0, bestStreak:0, correctCount:0, answered:{} };
      const ok = await storeSet(`game:${pin}:player:${id}`, doc);
      if(!ok){
        errSlot.appendChild(el(`<div class="feedback bad">Não foi possível entrar agora. Tente novamente.</div>`));
        joinBtn.disabled=false; return;
      }
      state = { screen:'player-lobby', pin, meta, playerKey:`game:${pin}:player:${id}`, doc };
      render();
    });
  }

  function playerRenderLobby(){
    app.innerHTML='';
    const wrap = el(`
      <div class="wrap">
        <div class="card">
          <div class="waiting-pulse">
            <div class="em" style="animation:none;">${avatarChipHTML(state.doc.avatar, 'xl')}</div>
            <div class="result-title" style="margin-top:10px;">Você entrou, ${escapeHtml(state.doc.name)}!</div>
            <div class="loading-note">Aguardando o(a) professor(a) iniciar o jogo…</div>
          </div>
          <div class="hud-item" style="justify-content:center;">🔑 Sala <b>${state.pin}</b></div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    async function poll(){
      const meta = await storeGet(`game:${state.pin}:meta`);
      if(meta && meta.phase==='question'){
        state.meta = meta;
        state.screen='player-question';
        render();
      }
    }
    pollTimer = setInterval(poll, GAME_POLL);
  }

  function playerRenderQuestion(){
    app.innerHTML='';
    const qIndex = state.meta.qIndex;
    const q = QUESTIONS[state.meta.order[qIndex]];
    const wrap = el(`
      <div class="wrap">
        <div class="hud">
          <div class="hud-item">${avatarChipHTML(state.doc.avatar)} <b>${escapeHtml(state.doc.name)}</b></div>
          <div class="qcounter">Pergunta ${qIndex+1} / ${state.meta.total}</div>
          <div class="hud-item">🏆 <b>${state.doc.score}</b></div>
        </div>
        <div class="wire-track"><div class="wire-fill" id="wireFill" style="width:100%"></div><div class="wire-spark" id="wireSpark" style="left:100%"></div></div>
        <div class="card">
          <div class="question-box"><div class="qnum">⚡ PERGUNTA ${qIndex+1}</div><div class="qtext">${escapeHtml(q.q)}</div>${q.code ? `<pre class="code-block">${escapeHtml(q.code)}</pre>` : ''}</div>
          <div class="options-grid" id="optsGrid"></div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    const grid = wrap.querySelector('#optsGrid');
    q.opts.forEach((opt,i)=>{
      const b = el(`<button class="opt opt-${OPT_STYLE[i]}" data-i="${i}"><span class="opt-icon">${OPT_ICON[i]}</span><span>${escapeHtml(opt)}</span></button>`);
      b.addEventListener('click', ()=>playerAnswer(i, q));
      grid.appendChild(b);
    });
    const fill = wrap.querySelector('#wireFill'), spark = wrap.querySelector('#wireSpark');
    const startTs = state.meta.qStartTs, duration = state.meta.qDuration;
    let submitted = false;
    tickTimer = setInterval(()=>{
      const left = duration - (Date.now()-startTs);
      if(left<=0){
        updateWire(fill,spark,0,duration); clearInterval(tickTimer);
        if(!submitted){ submitted=true; playerAnswer(-1, q); }
        return;
      }
      updateWire(fill,spark,left,duration);
    }, 150);
    state._submitGuard = ()=>{ if(submitted) return true; submitted=true; return false; };
  }

  async function playerAnswer(choice, q){
    if(state._submitGuard && state._submitGuard()===true && choice!==-1){
      // already auto-submitted by timeout; ignore late click
      return;
    }
    clearInterval(tickTimer);
    const qIndex = state.meta.qIndex;
    const startTs = state.meta.qStartTs, duration = state.meta.qDuration;
    const timeLeftMs = Math.max(0, duration - (Date.now()-startTs));
    const isCorrect = choice === q.correct;
    let pts = 0;
    if(isCorrect){
      pts = 500 + Math.round((timeLeftMs/duration)*500) + Math.min(state.doc.streak,5)*20;
      state.doc.streak += 1; state.doc.bestStreak = Math.max(state.doc.bestStreak, state.doc.streak); state.doc.correctCount += 1;
    } else state.doc.streak = 0;
    state.doc.score += pts;
    state.doc.answered = state.doc.answered || {};
    state.doc.answered[qIndex] = { choice, correct:isCorrect, timeLeftMs };
    await storeSet(state.playerKey, state.doc);
    state._lastAnswer = { isCorrect, pts, choice, q };
    state.screen = 'player-waiting';
    render();
  }

  function playerRenderWaiting(){
    app.innerHTML='';
    const { isCorrect, pts, choice, q } = state._lastAnswer;
    const wrap = el(`
      <div class="wrap">
        <div class="card">
          <div class="waiting-pulse">
            <div class="em">${isCorrect ? '✅' : (choice===-1 ? '⏱️' : '❌')}</div>
            <div class="result-title" style="margin-top:6px;">${isCorrect ? 'Certo! +'+pts+' pts' : (choice===-1?'Tempo esgotado':'Não foi dessa vez')}</div>
          </div>
          <div class="feedback ${isCorrect?'ok':'bad'}">${escapeHtml(q.exp)}</div>
          <div class="stat-row">
            <div class="stat-box"><div class="num">${state.doc.score}</div><div class="lab">Pontos</div></div>
            <div class="stat-box"><div class="num">${state.doc.bestStreak}🔥</div><div class="lab">Sequência</div></div>
          </div>
          <div class="loading-note">Aguardando o(a) professor(a) avançar…</div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    async function poll(){
      const meta = await storeGet(`game:${state.pin}:meta`);
      if(!meta) return;
      if(meta.phase==='end'){ state.meta=meta; state.screen='player-end'; render(); return; }
      if(meta.phase==='question' && meta.qIndex !== state.meta.qIndex){
        state.meta = meta; state.screen='player-question'; render(); return;
      }
    }
    pollTimer = setInterval(poll, GAME_POLL);
  }

  function playerRenderEnd(){
    app.innerHTML='';
    const pct = Math.round((state.doc.correctCount/state.meta.total)*100);
    const r = ratingFor(pct);
    const wrap = el(`
      <div class="wrap">
        <div class="card">
          <div style="display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:6px;">
            <div class="avatar-chip lg">${buildAvatarSVG(state.doc.avatar)}</div>
            <div style="font-size:44px;line-height:1;">${r.emoji}</div>
          </div>
          <div class="result-title">${r.title}</div>
          <div class="result-sub">${escapeHtml(state.doc.name)} acertou ${state.doc.correctCount} de ${state.meta.total} perguntas (${pct}%)</div>
          <div class="stat-row">
            <div class="stat-box"><div class="num">${state.doc.score}</div><div class="lab">Pontos</div></div>
            <div class="stat-box"><div class="num">${state.doc.correctCount}</div><div class="lab">Acertos</div></div>
            <div class="stat-box"><div class="num">${state.doc.bestStreak}🔥</div><div class="lab">Sequência</div></div>
          </div>
          <label class="field-label">🏆 Classificação da sala</label>
          <div class="leaderboard" id="lbSlot"><div class="loading-note">Carregando classificação…</div></div>
          <div class="btn-row"><button class="btn btn-primary" id="menuBtn">Voltar ao menu</button></div>
        </div>
      </div>
    `);
    app.appendChild(wrap);
    wrap.querySelector('#menuBtn').addEventListener('click', ()=>{ state={screen:'menu'}; render(); });
    (async ()=>{
      const keys = await storeListKeys(`game:${state.pin}:player:`);
      const docs = [];
      for(const k of keys){ const d = await storeGet(k); if(d) docs.push(d); }
      docs.sort((a,b)=>b.score-a.score);
      const slot = wrap.querySelector('#lbSlot'); slot.innerHTML='';
      docs.slice(0,10).forEach((p,i)=>{
        const mine = p.id === state.doc.id;
        slot.appendChild(el(`<div class="lb-row ${mine?'lb-you':''}"><div class="lb-rank">#${i+1}</div><div class="lb-name">${avatarChipHTML(p.avatar)} ${escapeHtml(p.name)}</div><div class="lb-score">${p.score} pts</div></div>`));
      });
      if(docs.length && docs[0].id===state.doc.id){
        burstParticles(['🏆','⚡','✨']);
        confettiRain(60);
        const myChip = wrap.querySelector('.avatar-chip.lg');
        if(myChip){ myChip.classList.add('jump'); }
      }
    })();
  }

  // ---------------- Theme (light/dark) ----------------
  const themeBtn = document.createElement('button');
  themeBtn.className = 'theme-toggle';
  themeBtn.type = 'button';
  themeBtn.title = 'Alternar tema claro/escuro';
  document.body.appendChild(themeBtn);

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  }
  applyTheme('dark');
  themeBtn.addEventListener('click', ()=>{
    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    storeSetPersonal('theme-pref', {theme: next});
  });
  storeGetPersonal('theme-pref').then(pref=>{
    if(pref && (pref.theme==='light' || pref.theme==='dark')) applyTheme(pref.theme);
  });

  render();
})();
</script>
</body>
</html>
